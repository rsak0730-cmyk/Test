<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Streamflix - Watch Party</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-main: #f8fafc; --text-main: #0f172a; --card-bg: #ffffff;
            --accent: #ef4444; --accent-light: #fef2f2; --accent-border: #fca5a5;
            --player-bg: #000000; --text-muted: #6b7280;
        }
        body.theme-cyberpunk {
            --bg-main: #050510; --text-main: #00ffcc; --card-bg: #0a0a1a;
            --accent: #ff00ff; --accent-light: #200030; --accent-border: #ff00ff;
            --player-bg: #000000; --text-muted: #0088aa;
        }
        body.theme-retro {
            --bg-main: #2b2b2b; --text-main: #ffcc00; --card-bg: #1a1a1a;
            --accent: #00ffff; --accent-light: #003333; --accent-border: #00ffff;
            --player-bg: #111; --text-muted: #aaaaaa;
            font-family: 'Courier New', Courier, monospace;
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%; min-height: 100vh; margin: 0; padding: 12px; padding-bottom: 95px !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main); color: var(--text-main);
            display: flex; flex-direction: column; align-items: center; overflow-x: hidden; transition: all 0.3s ease;
        }
        .container { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
        .card { width: 100%; background: var(--card-bg); border: 1px solid var(--accent-border); border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .card.black-player-box { background-color: var(--player-bg) !important; border: 1px solid #27272a !important; color: #ffffff !important; }
        .card-header-sm { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
        .code-box { background: var(--card-bg); border: 2px dashed var(--accent-border); border-radius: 14px; padding: 12px; text-align: center; font-size: 22px; font-weight: 900; color: var(--accent); letter-spacing: 2px; margin-bottom: 12px; width: 100%; }
        .code-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; width: 100%; }
        .code-action-btn { background: var(--accent-light); border: 1px solid var(--accent-border); color: var(--accent); font-weight: 700; font-size: 11px; padding: 10px 4px; border-radius: 12px; text-align: center; cursor: pointer; width: 100%; }
        .search-input, .code-input, select { width: 100%; background: transparent; border: 1px solid var(--accent-border); color: var(--text-main); padding: 12px 14px; border-radius: 12px; font-size: 14px; outline: none; margin-bottom: 8px; font-weight: 600; }
        .btn-purple { background: var(--accent); color: #fff; border: none; width: 100%; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .iframe-wrapper { position: relative; width: 100%; height: 240px; border-radius: 12px; overflow: hidden; background: #000; margin-top: 8px; border: 1px solid #475569; }
        #qrCodeContainer { width: 100%; display: flex; justify-content: center; }
        #qrCodeContainer img { margin: 0 auto; border-radius: 8px; padding: 5px; background: white; }
        .soundboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; width: 100%; }
        .sound-btn { background: var(--accent-light); border: 1px solid var(--accent-border); padding: 8px; border-radius: 10px; font-size: 16px; text-align: center; cursor: pointer; }
        .status-badge { font-size: 10px; padding: 3px 6px; border-radius: 4px; margin-left: 6px; font-weight: 800; }
        .status-host { background: #dcfce7; color: #16a34a; }
        .status-afk { background: #fef08a; color: #854d0e; }
        .status-vip { background: #e879f9; color: #701a75; }
        .hidden { display: none !important; }
        #sleepOverlay { position: fixed; inset: 0; background: #000; z-index: 999999999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        #mainLandingView, #hostSessionView { width: 100%; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <div id="sleepOverlay" class="hidden">
        <h1 style="color: #60a5fa;">🌙 Sleep Timer Active</h1>
        <p>The room has been paused and muted due to inactivity or sleep timer.</p>
        <button class="btn-purple" style="width: 200px; margin-top: 20px;" onclick="wakeUpRoom()">Wake Up</button>
    </div>

    <div class="container">
        <!-- Customization Card -->
        <div class="card" id="settingsCard">
            <div class="card-header-sm"><span>⚙️ Virtual Themes & Profile</span></div>
            <select id="themeSelector" onchange="changeTheme(this.value)">
                <option value="default">Default Light Theme</option>
                <option value="cyberpunk">Cyberpunk Neon</option>
                <option value="retro">Retro VHS</option>
            </select>
            <select id="statusSelector" onchange="updateUserStatus(this.value)" style="margin-top: 8px;">
                <option value="Online">Status: Online</option>
                <option value="AFK">Status: AFK</option>
                <option value="VIP">Status: VIP 👑</option>
            </select>
            <input type="text" id="userNameInput" class="code-input" placeholder="Your Name" style="margin-top: 8px;" oninput="saveProfileChanges()">
            <button class="code-action-btn" style="width: 100%; margin-top: 4px;" onclick="connectBiometrics()">❤️ Connect Mood Ring (Bluetooth HR)</button>
        </div>

        <div id="mainLandingView">
            <div class="header">
                <div class="logo-area"><h1 style="margin:0; font-size:22px; color:var(--accent);">Streamflix</h1></div>
            </div>
            <div class="card" onclick="startHostingSession()" style="cursor:pointer;"><div style="font-weight: 800; color: var(--accent);">🎬 Host Movie Room</div></div>
            <div class="card">
                <div class="card-header-sm"><span>JOIN WITH CODE</span></div>
                <input type="text" id="roomCodeInput" class="code-input" placeholder="Room Code">
                <button class="btn-purple" onclick="connectToRoom()">⚡ CONNECT</button>
            </div>
        </div>

        <div id="hostSessionView" class="hidden">
            <div class="header" style="justify-content: flex-start; gap: 12px;">
                <button class="back-btn" onclick="exitRoom()" style="background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-main);">←</button>
                <h2 style="font-size: 16px; margin:0;">Room Session</h2>
            </div>
            
            <div class="card">
                <div class="card-header-sm"><span>ROOM CODE & QR JOIN</span></div>
                <div class="code-box"><span id="displayRoomCode">SYNC-0000</span></div>
                <div id="qrCodeContainer"></div>
                <div class="code-actions" style="margin-top: 10px;">
                    <button class="code-action-btn" onclick="copyCode()">📋 Copy</button>
                    <button class="code-action-btn" onclick="generateCalendarInvite()">📅 ICS Invite</button>
                </div>
            </div>

            <!-- Host Controls -->
            <div class="card" id="hostControlsWrapper">
                <div class="card-header-sm"><span>🎛️ Master Sync Controls</span></div>
                <label style="font-size: 12px; font-weight: bold; color: var(--text-muted);">Master Volume Sync</label>
                <input type="range" id="masterVolume" min="0" max="1" step="0.1" value="1" style="width: 100%; margin-bottom: 12px;" onchange="syncMasterVolume(this.value)">
                
                <label style="font-size: 12px; font-weight: bold; color: var(--text-muted);">Smart Sleep Timer (Minutes)</label>
                <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <input type="number" id="sleepTimerInput" class="code-input" placeholder="45" style="margin-bottom: 0;">
                    <button class="btn-purple" style="width: auto; padding: 12px;" onclick="startSleepTimer()">Set</button>
                </div>

                <button class="code-action-btn" style="width: 100%; padding: 12px;" onclick="initP2PStream()">📁 Broadcast Local P2P Stream File</button>
                <input type="file" id="localMovieFile" class="hidden" accept="video/*" onchange="handleFileSelected(this)">
            </div>

            <!-- Video Player -->
            <div class="card black-player-box">
                <div class="card-header-sm"><span>📺 Screen</span></div>
                <div id="iframeWrapper" class="iframe-wrapper">
                    <iframe id="movieIframe" src="" width="100%" height="100%" frameborder="0" allowfullscreen allow="autoplay; fullscreen"></iframe>
                </div>
                <video id="syncVideoPlayer" style="width: 100%; display: none;" controls></video>
            </div>

            <!-- Interactive Soundboard -->
            <div class="card">
                <div class="card-header-sm"><span>🔊 Interactive Soundboard</span></div>
                <div class="soundboard-grid">
                    <div class="sound-btn" onclick="playSound('rimshot')">🥁</div>
                    <div class="sound-btn" onclick="playSound('airhorn')">📯</div>
                    <div class="sound-btn" onclick="playSound('cricket')">🦗</div>
                    <div class="sound-btn" onclick="playSound('gasp')">😱</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header-sm"><span>IN THIS ROOM</span></div>
                <div id="peerListContainer" style="width: 100%;"></div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Elements -->
    <audio id="sfx-rimshot" src="https://www.myinstants.com/media/sounds/rimshot.mp3"></audio>
    <audio id="sfx-airhorn" src="https://www.myinstants.com/media/sounds/mlg-airhorn.mp3"></audio>
    <audio id="sfx-cricket" src="https://www.myinstants.com/media/sounds/crickets.mp3"></audio>
    <audio id="sfx-gasp" src="https://www.myinstants.com/media/sounds/gasp.mp3"></audio>

    <script>
        const BACKEND_WS = 'wss://syncbeat-backend2.onrender.com'; 
        let ws = null; 
        let isHosting = false; 
        let currentRoomCode = ""; 
        let currentUserName = localStorage.getItem('syncbeat_device_name') || "User";
        let currentUserStatus = "Online";
        let currentHeartRate = null;
        let sleepTimeout = null;
        let videoPlayer = document.getElementById('syncVideoPlayer');
        let peerConnections = {};

        document.getElementById('userNameInput').value = currentUserName;

        function changeTheme(themeName) {
            document.body.className = '';
            if (themeName !== 'default') document.body.classList.add(`theme-${themeName}`);
        }

        function updateUserStatus(status) {
            currentUserStatus = status;
            sendPresence();
        }

        function saveProfileChanges() {
            currentUserName = document.getElementById('userNameInput').value || "User";
            localStorage.setItem('syncbeat_device_name', currentUserName);
            sendPresence();
        }

        function sendPresence() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'UPDATE_STATUS', name: currentUserName, status: currentUserStatus, hr: currentHeartRate }));
            }
        }

        async function connectBiometrics() {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('heart_rate');
                const characteristic = await service.getCharacteristic('heart_rate_measurement');
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (e) => {
                    currentHeartRate = e.target.value.getUint8(1);
                    sendPresence();
                });
                alert("Mood Ring connected successfully via Bluetooth!");
            } catch (err) {
                console.error("Bluetooth pairing failed:", err);
                alert("Could not connect biometric wearable.");
            }
        }

        function initP2PStream() {
            if(!isHosting) return;
            document.getElementById('localMovieFile').click();
        }

        function handleFileSelected(input) {
            const file = input.files[0];
            if(!file) return;
            document.getElementById('iframeWrapper').classList.add('hidden');
            videoPlayer.style.display = 'block';
            videoPlayer.src = URL.createObjectURL(file);
            videoPlayer.play();
            alert("Local P2P stream loaded.");
        }

        function connectWebSocket(onSuccess) { 
            if (ws && ws.readyState === WebSocket.OPEN) { if (onSuccess) onSuccess(); return; } 
            ws = new WebSocket(BACKEND_WS); 
            ws.onopen = () => { if (onSuccess) onSuccess(); }; 
            ws.onmessage = async (event) => { 
                const data = JSON.parse(event.data); 
                if(data.type === 'PEER_LIST') {
                    renderPeers(data.peers);
                } else if (data.type === 'SYNC_VOLUME') {
                    videoPlayer.volume = data.level;
                } else if (data.type === 'PLAY_SOUND') {
                    document.getElementById(`sfx-${data.sound}`).play().catch(e => {});
                } else if (data.type === 'SLEEP_TRIGGER') {
                    triggerSleepMode();
                } else if (data.type === 'webrtc_offer' && !isHosting) {
                    handleWebRtcOffer(data);
                } else if (data.type === 'webrtc_answer' && isHosting) {
                    if(peerConnections[data.senderAccountId]) {
                        await peerConnections[data.senderAccountId].setRemoteDescription(new RTCSessionDescription(data.answer));
                    }
                } else if (data.type === 'ice_candidate') {
                    const pc = peerConnections[data.senderAccountId] || window.clientPC;
                    if(pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }; 
        }

        async function handleWebRtcOffer(data) {
            const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            window.clientPC = pc;
            pc.ontrack = (event) => {
                document.getElementById('iframeWrapper').classList.add('hidden');
                videoPlayer.style.display = 'block';
                videoPlayer.srcObject = event.streams[0];
                videoPlayer.play();
            };
            pc.onicecandidate = (e) => {
                if(e.candidate) ws.send(JSON.stringify({ type: 'ice_candidate', candidate: e.candidate, targetAccountId: data.senderAccountId }));
            };
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: 'webrtc_answer', answer: answer, targetAccountId: data.senderAccountId }));
        }

        function startHostingSession() {
            currentRoomCode = 'SYNC-' + Math.random().toString(36).substring(2, 6).toUpperCase(); 
            connectWebSocket(() => { 
                isHosting = true; 
                ws.send(JSON.stringify({ type: 'HOST_ROOM', code: currentRoomCode, name: currentUserName })); 
                setupRoomUI(currentRoomCode);
                generateQR(currentRoomCode);
            }); 
        }

        function connectToRoom() {
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if(!code) return;
            currentRoomCode = code;
            connectWebSocket(() => {
                isHosting = false;
                ws.send(JSON.stringify({ type: 'JOIN_ROOM', code: code, name: currentUserName }));
                setupRoomUI(code);
            });
        }

        function setupRoomUI(code) {
            document.getElementById('mainLandingView').classList.add('hidden');
            document.getElementById('settingsCard').classList.add('hidden');
            document.getElementById('hostSessionView').classList.remove('hidden');
            document.getElementById('displayRoomCode').textContent = code;
            document.getElementById('hostControlsWrapper').classList.toggle('hidden', !isHosting);
            sendPresence();
        }

        function exitRoom() {
            if(ws) ws.close();
            document.getElementById('hostSessionView').classList.add('hidden');
            document.getElementById('mainLandingView').classList.remove('hidden');
            document.getElementById('settingsCard').classList.remove('hidden');
            document.getElementById('qrCodeContainer').innerHTML = '';
            document.getElementById('movieIframe').src = '';
            videoPlayer.src = '';
            isHosting = false;
            clearTimeout(sleepTimeout);
        }

        function generateQR(code) {
            const container = document.getElementById('qrCodeContainer');
            container.innerHTML = '';
            new QRCode(container, { text: `${window.location.origin}/movies.html?join=${code}`, width: 128, height: 128 });
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const joinCode = params.get('join');
            if (joinCode) {
                document.getElementById('roomCodeInput').value = joinCode;
                connectToRoom();
            }
        };

        function generateCalendarInvite() {
            const now = new Date();
            const start = now.toISOString().replace(/-|:|\.\d+/g, '');
            const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${start}\nSUMMARY:Watch Party (${currentRoomCode})\nEND:VEVENT\nEND:VCALENDAR`;
            const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = `watch_party_${currentRoomCode}.ics`;
            link.click();
        }

        function startSleepTimer() {
            const mins = parseInt(document.getElementById('sleepTimerInput').value);
            if(isNaN(mins) || mins <= 0) return alert("Enter valid minutes");
            clearTimeout(sleepTimeout);
            sleepTimeout = setTimeout(() => {
                if(isHosting && ws) ws.send(JSON.stringify({ type: 'SLEEP_TRIGGER' }));
                triggerSleepMode();
            }, mins * 60000);
            alert(`Sleep timer set for ${mins} minutes.`);
        }

        function triggerSleepMode() {
            document.getElementById('sleepOverlay').classList.remove('hidden');
            videoPlayer.pause();
            videoPlayer.muted = true;
        }

        function wakeUpRoom() {
            document.getElementById('sleepOverlay').classList.add('hidden');
            videoPlayer.muted = false;
        }

        function syncMasterVolume(level) {
            if(!isHosting) return;
            videoPlayer.volume = level;
            if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'SYNC_VOLUME', level: level }));
        }

        function playSound(soundId) {
            document.getElementById(`sfx-${soundId}`).play().catch(e => {});
            if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'PLAY_SOUND', sound: soundId }));
        }

        function renderPeers(peers) {
            const container = document.getElementById('peerListContainer');
            container.innerHTML = '';
            peers.forEach(peer => {
                let badgeClass = peer.role === 'HOST' ? 'status-host' : 'status-afk';
                if(peer.status === 'VIP') badgeClass = 'status-vip';
                let hrDisplay = peer.hr ? ` ❤️ ${peer.hr}bpm` : '';
                container.innerHTML += `
                    <div style="padding: 10px; border-bottom: 1px solid var(--accent-border); display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <span>👤 ${peer.name} <span class="status-badge ${badgeClass}">${peer.status || 'Online'}</span>${hrDisplay}</span>
                        <span style="font-size: 10px; font-weight: bold;">${peer.role}</span>
                    </div>`;
            });
        }
    </script>
</body>
</html>
