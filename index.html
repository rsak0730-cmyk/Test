<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncPlay Premium</title>
    
    <!-- PWA Links -->
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <script src="https://www.youtube.com/iframe_api"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --color-accent: 0 255 204; --color-bg-base: 15 23 42; --color-bg-card: 30 41 59; 
            --color-text-main: 255 255 255; --color-text-muted: 148 163 184; --color-border: 51 65 85; 
        }

        body { 
            background-color: rgb(var(--color-bg-base)); 
            color: rgb(var(--color-text-main)); 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden; -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism & Themes */
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .card { background: rgb(var(--color-bg-card)); border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4); }
        
        /* VIP Glow & Shimmer */
        .vip-glow {
            background: linear-gradient(90deg, #ff007f, #7928ca, #00d2ff, #ff007f);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            animation: shine 3s linear infinite;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        @keyframes shine { to { background-position: 200% center; } }
        
        /* Views System */
        .view { display: none; width: 100%; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Full Screen Room Container */
        #roomView { position: fixed; inset: 0; width: 100vw; height: 100vh; background: rgb(var(--color-bg-base)); z-index: 50; overflow-y: auto; display: none; padding-bottom: 80px; }
        #roomView.active { display: block; }

        /* Timeline & Progress */
        .progress-track { background: rgba(255, 255, 255, 0.1); height: 8px; border-radius: 4px; cursor: pointer; margin: 12px 0; position: relative; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #00d2ff, #3a7bd5); width: 0%; height: 100%; pointer-events: none; transition: width 0.2s linear; }

        /* Chat & Floating Emojis */
        .chat-container { height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .floating-reaction { position: absolute; bottom: 80px; font-size: 32px; animation: floatUp 2s ease-out forwards; pointer-events: none; z-index: 100; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-150px) scale(1.5); opacity: 0; } }

        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-content { background: rgb(var(--color-bg-card)); padding: 24px; border-radius: 24px; width: 90%; max-width: 380px; transform: scale(0.95); transition: 0.3s; border: 1px solid rgba(255,255,255,0.1); }
        .modal-overlay.show .modal-content { transform: scale(1); }

        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #00d2ff; color: #000; padding: 12px 24px; border-radius: 20px; font-weight: 800; z-index: 999; transition: 0.4s; box-shadow: 0 10px 25px rgba(0,210,255,0.5); }
        #toast.show { transform: translateX(-50%) translateY(0); }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center">

    <div id="toast">Notification</div>

    <!-- MAIN APP CONTAINER -->
    <div class="w-full max-w-md p-4 flex-1 overflow-y-auto pb-24 relative">
        
        <!-- ================= MAIN TAB ================= -->
        <div id="tab-main" class="view active">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">SYNCPLAY</h1>
                <div class="glass px-3 py-1 rounded-full text-sm font-bold flex items-center gap-2">
                    <span id="headerAvatar">🤖</span> <span id="headerName">Guest</span>
                </div>
            </div>

            <div class="card space-y-4">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Create Room</h2>
                <button onclick="openModal('typeModal')" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold py-4 rounded-xl shadow-[0_0_15px_rgba(8,145,178,0.4)] active:scale-95 transition-transform">
                    <i class="fa-solid fa-plus mr-2"></i> HOST SESSION
                </button>
            </div>

            <div class="card space-y-4">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Join Room</h2>
                <input type="text" id="joinRoomInput" placeholder="ENTER CODE" class="w-full bg-black/50 border border-gray-600 p-4 rounded-xl text-center text-xl font-mono uppercase tracking-widest focus:outline-none focus:border-cyan-400">
                <button onclick="joinRoom()" class="w-full bg-white/10 border border-cyan-500/50 text-cyan-400 font-bold py-3 rounded-xl active:scale-95 transition-transform">
                    JOIN ROOM
                </button>
            </div>
        </div>

        <!-- ================= SETTINGS TAB ================= -->
        <div id="tab-settings" class="view">
            <h1 class="text-2xl font-black mb-6">SETTINGS</h1>
            
            <div class="card space-y-4 relative overflow-hidden">
                <div id="vipBgGlow" class="absolute inset-0 bg-gradient-to-r from-pink-500/20 via-purple-500/20 to-cyan-500/20 hidden"></div>
                <div class="relative z-10">
                    <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Profile & Device</h2>
                    <input type="text" id="profileName" onchange="saveProfile()" placeholder="Display Name" class="w-full bg-black/50 border border-gray-600 p-3 rounded-xl mb-2 text-white focus:outline-none">
                    <div class="text-[10px] text-gray-500 font-mono">DEVICE ID: <span id="deviceIdDisplay"></span></div>
                    <div id="vipBadgeDisplay" class="hidden mt-2"><span class="bg-cyan-500/20 border border-cyan-500 text-cyan-400 text-xs px-2 py-1 rounded font-bold">💎 VIP UNLOCKED</span></div>
                </div>
            </div>

            <div class="card space-y-4">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Redeem Reward Code</h2>
                <div class="flex gap-2">
                    <input type="text" id="redeemInput" placeholder="Enter code (e.g. EDIT.OG_)" class="flex-1 bg-black/50 border border-gray-600 p-3 rounded-xl text-sm focus:outline-none">
                    <button onclick="redeemCode()" class="bg-cyan-600 px-4 rounded-xl font-bold">REDEEM</button>
                </div>
            </div>

            <div class="card space-y-4">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Choose Avatar</h2>
                <div id="avatarGrid" class="grid grid-cols-4 gap-2 max-h-40 overflow-y-auto p-2"></div>
            </div>

            <div class="card space-y-4">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Unlocked Achievements</h2>
                <div id="achievementsGrid" class="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- ================= BOTTOM NAVIGATION ================= -->
    <div id="bottomNav" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[90%] max-w-sm glass rounded-3xl flex justify-around p-3 z-40">
        <button onclick="switchTab('main')" id="nav-main" class="text-cyan-400 flex flex-col items-center flex-1 transition-colors"><i class="fa-solid fa-house text-xl"></i><span class="text-[10px] font-bold mt-1">MAIN</span></button>
        <button onclick="switchTab('settings')" id="nav-settings" class="text-gray-500 flex flex-col items-center flex-1 transition-colors"><i class="fa-solid fa-gear text-xl"></i><span class="text-[10px] font-bold mt-1">SETTINGS</span></button>
    </div>

    <!-- ================= ROOM TYPE MODAL ================= -->
    <div id="typeModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="text-lg font-bold mb-4">Select Room Type</h3>
            <div class="space-y-3">
                <button onclick="createRoom('movie')" class="w-full glass p-4 rounded-xl flex items-center gap-4 hover:bg-white/10 text-left">
                    <i class="fa-solid fa-film text-2xl text-cyan-400"></i>
                    <div><div class="font-bold">Movie Room</div><div class="text-xs text-gray-400">Local Files Only</div></div>
                </button>
                <button onclick="createRoom('music')" class="w-full glass p-4 rounded-xl flex items-center gap-4 hover:bg-white/10 text-left">
                    <i class="fa-solid fa-music text-2xl text-cyan-400"></i>
                    <div><div class="font-bold">Music Room</div><div class="text-xs text-gray-400">Audio + Thumbnail</div></div>
                </button>
                <button onclick="createRoom('youtube')" class="w-full glass p-4 rounded-xl flex items-center gap-4 hover:bg-white/10 text-left">
                    <i class="fa-brands fa-youtube text-2xl text-cyan-400"></i>
                    <div><div class="font-bold">YouTube Live</div><div class="text-xs text-gray-400">Watch together</div></div>
                </button>
            </div>
            <button onclick="closeModal('typeModal')" class="w-full mt-4 p-3 bg-gray-800 rounded-xl font-bold text-sm">CANCEL</button>
        </div>
    </div>

    <!-- ================= FULL SCREEN ROOM VIEW ================= -->
    <div id="roomView">
        <!-- Room Header -->
        <div class="glass p-4 flex justify-between items-center sticky top-0 z-50">
            <button onclick="leaveRoom()" class="bg-red-500/20 text-red-400 px-3 py-1 rounded-lg font-bold text-xs">LEAVE</button>
            <div class="text-center">
                <div id="roomTitleUI" class="text-xs font-bold text-cyan-400 tracking-widest">MUSIC ROOM</div>
                <div id="roomCodeUI" class="font-mono font-bold tracking-widest text-lg">----</div>
            </div>
            <div class="text-xs font-bold flex items-center gap-1 text-gray-400"><i class="fa-solid fa-users"></i> <span id="peerCount">1</span></div>
        </div>

        <div class="p-4 space-y-4">
            <!-- Host Controls Area -->
            <div id="hostControls" class="card hidden space-y-3 border border-cyan-500/30">
                <h3 class="text-xs font-bold text-cyan-400">HOST CONTROLS</h3>
                <div id="movieInputArea" class="hidden">
                    <label class="block text-xs text-gray-400 mb-1">Upload Local Media (Members must upload same file):</label>
                    <input type="file" accept="video/*" onchange="handleLocalFile(this)" class="w-full text-sm">
                </div>
                <div id="youtubeInputArea" class="hidden">
                    <input type="text" id="ytUrlInput" placeholder="Paste YouTube Link or Search ID" class="w-full bg-black/50 p-3 rounded-xl border border-gray-600 text-sm focus:outline-none">
                    <button onclick="loadYouTube()" class="w-full mt-2 bg-cyan-600 py-2 rounded-xl font-bold text-sm">LOAD VIDEO</button>
                </div>
                <div id="musicInputArea" class="hidden">
                    <input type="text" id="musicUrlInput" placeholder="Paste Audio URL (.mp3, .wav)" class="w-full bg-black/50 p-3 rounded-xl border border-gray-600 text-sm focus:outline-none">
                    <button onclick="loadMusic()" class="w-full mt-2 bg-cyan-600 py-2 rounded-xl font-bold text-sm">LOAD AUDIO</button>
                </div>
            </div>

            <!-- Media Player Container -->
            <div class="bg-black rounded-2xl border border-gray-800 overflow-hidden relative shadow-2xl">
                <!-- Sync Status -->
                <div class="absolute top-2 left-2 z-10 bg-black/60 backdrop-blur px-2 py-1 rounded text-[10px] font-bold flex items-center gap-1">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> <span id="syncStatusUI">SYNCED (18ms)</span>
                </div>
                <div class="absolute top-2 right-2 z-10 bg-black/60 backdrop-blur px-2 py-1 rounded text-[10px] font-bold">
                    ROLE: <span id="userRoleUI" class="text-cyan-400">MEMBER</span>
                </div>

                <!-- Players -->
                <div id="ytPlayerContainer" class="w-full aspect-video hidden"><div id="ytPlayer"></div></div>
                <video id="localVideoPlayer" class="w-full aspect-video hidden" playsinline></video>
                <div id="musicPlayerContainer" class="w-full aspect-video hidden flex items-center justify-center bg-gray-900 bg-cover bg-center">
                    <div class="w-32 h-32 rounded-2xl bg-gradient-to-tr from-purple-500 to-cyan-500 animate-pulse flex items-center justify-center shadow-[0_0_40px_rgba(168,85,247,0.4)]">
                        <i class="fa-solid fa-music text-4xl text-white"></i>
                    </div>
                    <audio id="audioPlayer"></audio>
                </div>
                
                <!-- Floating Emoji Area -->
                <div id="reactionArea" class="absolute inset-0 pointer-events-none flex justify-center overflow-hidden"></div>

                <!-- Custom Timeline & Controls -->
                <div class="p-4 bg-gradient-to-t from-black to-transparent">
                    <div class="progress-track" id="progressTrack" onclick="scrubTimeline(event)">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="flex justify-between text-[10px] font-mono text-gray-400 mb-2">
                        <span id="currentTimeUI">0:00</span><span id="durationUI">0:00</span>
                    </div>
                    <div class="flex justify-center">
                        <button id="playPauseBtn" onclick="togglePlay()" class="w-12 h-12 rounded-full bg-cyan-600 flex items-center justify-center text-xl shadow-[0_0_15px_rgba(8,145,178,0.5)] disabled:opacity-50">
                            <i class="fa-solid fa-play"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chat & Emojis -->
            <div class="card flex flex-col h-64">
                <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-2">
                    <h3 class="text-xs font-bold text-gray-400">LIVE CHAT</h3>
                    <div class="flex gap-2">
                        <button onclick="sendEmoji('❤️')" class="text-xl hover:scale-110 transition-transform">❤️</button>
                        <button onclick="sendEmoji('😂')" class="text-xl hover:scale-110 transition-transform">😂</button>
                        <button onclick="sendEmoji('🔥')" class="text-xl hover:scale-110 transition-transform">🔥</button>
                        <button onclick="sendEmoji('👏')" class="text-xl hover:scale-110 transition-transform">👏</button>
                    </div>
                </div>
                <div id="chatBox" class="chat-container flex-1 mb-2 text-sm"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" placeholder="Message room..." class="flex-1 bg-black/50 border border-gray-600 rounded-xl px-3 py-2 text-sm focus:outline-none" onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()" class="bg-white/10 px-4 rounded-xl"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA SETS ---
        const AVATARS = [
            '🤖 Cyberpunk', '🥷 Neon Warrior', '🧑‍🚀 Space Explorer', '👾 Pixel Char', '👩‍💻 Hacker', 
            '🐱 Anime Cat', '🌌 Cosmic', '🕹️ Arcade', '👤 Shadow', '🎹 Synthwave', 
            '🧙 Fantasy', '🚀 Astronaut', '🛡️ Guardian', '🎧 Neon DJ', '🎬 Movie Buff', 
            '🎵 Maestro', '▶️ Tuber', '💻 Glitch', '🧠 AI Mind', '🎭 Actor'
        ];
        
        const ACHIEVEMENTS = [
            { id: 'NIGHT_OWL', title: 'NIGHT OWL', desc: 'Host a room after 2 AM', done: true },
            { id: 'MUSIC_LOVER', title: 'MUSIC LOVER', desc: 'Host music room for 100min', done: false },
            { id: 'MOVIE_LOVER', title: 'MOVIE LOVER', desc: 'Sync local movie files', done: true },
            { id: 'WATCH_PARTY', title: 'WATCH PARTY', desc: 'Have 5+ members', done: false },
            { id: 'FIRST_HOST', title: 'FIRST HOST', desc: 'Create first room', done: true },
            { id: 'ROOM_MASTER', title: 'ROOM MASTER', desc: 'Host 10+ rooms', done: false },
            { id: 'SOCIAL_STAR', title: 'SOCIAL STAR', desc: 'Send 100 chats', done: true },
            { id: 'REACTION_KING', title: 'REACTION KING', desc: 'Spam 50 emojis', done: false },
            { id: 'YOUTUBE_EXPLORER', title: 'YT EXPLORER', desc: 'Use 5 YT rooms', done: true },
            { id: 'DJ', title: 'DJ', desc: 'Play 10 different tracks', done: false }
            // Representing the 20+ required categories
        ];

        // --- STATE ---
        let user = { name: 'Guest', avatar: '🤖', isVip: false, deviceId: '' };
        let room = { active: false, code: '', type: '', role: 'MEMBER' };
        let ytPlayer = null;
        let activeMedia = null;
        let isPlaying = false;
        let syncLoop = null;

        // --- INIT ---
        window.onload = () => {
            initDevice();
            renderSettings();
            
            // Setup Service Worker for PWA (referencing sw.js)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function initDevice() {
            let id = localStorage.getItem('sb_device_id');
            if (!id) {
                id = 'EDIT-' + Math.random().toString(36).substr(2, 4).toUpperCase() + '-' + Math.random().toString(36).substr(2, 4).toUpperCase();
                localStorage.setItem('sb_device_id', id);
            }
            user.deviceId = id;
            user.name = localStorage.getItem('sb_name') || `User_${id.split('-')[1]}`;
            user.avatar = localStorage.getItem('sb_avatar') || AVATARS[0];
            user.isVip = localStorage.getItem('sb_vip') === 'true';
            
            document.getElementById('profileName').value = user.name;
            document.getElementById('deviceIdDisplay').textContent = id;
            updateHeader();
        }

        function updateHeader() {
            document.getElementById('headerAvatar').textContent = user.avatar.split(' ')[0];
            const nameEl = document.getElementById('headerName');
            nameEl.textContent = user.name;
            if(user.isVip) {
                nameEl.classList.add('vip-glow');
                document.getElementById('vipBadgeDisplay').classList.remove('hidden');
                document.getElementById('vipBgGlow').classList.remove('hidden');
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            document.getElementById('nav-main').classList.replace('text-cyan-400', 'text-gray-500');
            document.getElementById('nav-settings').classList.replace('text-cyan-400', 'text-gray-500');
            document.getElementById(`nav-${tab}`).classList.replace('text-gray-500', 'text-cyan-400');
        }

        // --- SETTINGS (AVATAR & REWARD CODE) ---
        function renderSettings() {
            const avGrid = document.getElementById('avatarGrid');
            avGrid.innerHTML = '';
            AVATARS.forEach(a => {
                const btn = document.createElement('button');
                btn.className = `glass p-2 rounded-xl text-2xl hover:bg-white/20 ${user.avatar === a ? 'border border-cyan-400' : ''}`;
                btn.textContent = a.split(' ')[0];
                btn.onclick = () => { user.avatar = a; localStorage.setItem('sb_avatar', a); renderSettings(); updateHeader(); };
                avGrid.appendChild(btn);
            });

            const acGrid = document.getElementById('achievementsGrid');
            acGrid.innerHTML = '';
            ACHIEVEMENTS.filter(a => a.done).forEach(a => {
                acGrid.innerHTML += `<div class="glass p-2 rounded-xl border-l-2 border-cyan-400 text-left"><div class="text-[10px] font-bold text-white">${a.title}</div><div class="text-[9px] text-gray-400">${a.desc}</div></div>`;
            });
        }

        function saveProfile() {
            user.name = document.getElementById('profileName').value || 'Guest';
            localStorage.setItem('sb_name', user.name);
            updateHeader();
            showToast("Profile Updated");
        }

        function redeemCode() {
            const code = document.getElementById('redeemInput').value.trim().toUpperCase();
            if (code === 'EDIT.OG_') {
                user.isVip = true;
                localStorage.setItem('sb_vip', 'true');
                updateHeader();
                showToast("VIP UNLOCKED: Neon Glow Activated!");
            } else {
                showToast("Invalid Reward Code");
            }
            document.getElementById('redeemInput').value = '';
        }

        // --- ROOM FLOW ---
        function openModal(id) { document.getElementById(id).classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        function createRoom(type) {
            closeModal('typeModal');
            room = {
                active: true,
                code: Math.random().toString(36).substr(2, 6).toUpperCase(),
                type: type,
                role: 'HOST'
            };
            setupRoomUI();
        }

        function joinRoom() {
            const code = document.getElementById('joinRoomInput').value.trim().toUpperCase();
            if(code.length < 4) return showToast("Invalid Code");
            room = { active: true, code: code, type: 'youtube', role: 'MEMBER' }; // Mocking type for demo
            setupRoomUI();
        }

        function setupRoomUI() {
            document.getElementById('bottomNav').style.display = 'none';
            document.getElementById('roomView').classList.add('active');
            
            document.getElementById('roomTitleUI').textContent = room.type.toUpperCase() + " ROOM";
            document.getElementById('roomCodeUI').textContent = room.code;
            document.getElementById('userRoleUI').textContent = room.role;
            
            // Reset UI
            document.getElementById('hostControls').classList.add('hidden');
            document.getElementById('movieInputArea').classList.add('hidden');
            document.getElementById('youtubeInputArea').classList.add('hidden');
            document.getElementById('musicInputArea').classList.add('hidden');
            
            document.getElementById('ytPlayerContainer').classList.add('hidden');
            document.getElementById('localVideoPlayer').classList.add('hidden');
            document.getElementById('musicPlayerContainer').classList.add('hidden');
            
            document.getElementById('playPauseBtn').disabled = (room.role === 'MEMBER');

            if(room.role === 'HOST') {
                document.getElementById('hostControls').classList.remove('hidden');
                if(room.type === 'movie') document.getElementById('movieInputArea').classList.remove('hidden');
                if(room.type === 'youtube') document.getElementById('youtubeInputArea').classList.remove('hidden');
                if(room.type === 'music') document.getElementById('musicInputArea').classList.remove('hidden');
            }

            // Initialize YouTube API if needed
            if(room.type === 'youtube' && !ytPlayer) {
                ytPlayer = new YT.Player('ytPlayer', {
                    height: '100%', width: '100%',
                    playerVars: { 'controls': 0, 'disablekb': 1 },
                    events: { 'onStateChange': onYtStateChange }
                });
            }

            // Start Sync Mock Loop
            clearInterval(syncLoop);
            syncLoop = setInterval(updateProgress, 500);
            
            addSystemMessage(`${user.name} joined as ${room.role}`);
        }

        function leaveRoom() {
            room.active = false;
            clearInterval(syncLoop);
            if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
            if(activeMedia) activeMedia.pause();
            
            document.getElementById('roomView').classList.remove('active');
            document.getElementById('bottomNav').style.display = 'flex';
            document.getElementById('chatBox').innerHTML = '';
        }

        // --- MEDIA CONTROL ---
        function loadYouTube() {
            const val = document.getElementById('ytUrlInput').value;
            let id = val;
            const match = val.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=|shorts\/))([\w-]{11})/);
            if(match) id = match[1];
            
            document.getElementById('ytPlayerContainer').classList.remove('hidden');
            if(ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(id);
                activeMedia = 'youtube';
            }
        }

        function handleLocalFile(input) {
            const file = input.files[0];
            if(!file) return;
            const url = URL.createObjectURL(file);
            const video = document.getElementById('localVideoPlayer');
            video.src = url;
            video.classList.remove('hidden');
            activeMedia = video;
            
            // Mock sync message
            addSystemMessage(`Host loaded local file: ${file.name}`);
        }

        function loadMusic() {
            const url = document.getElementById('musicUrlInput').value;
            const audio = document.getElementById('audioPlayer');
            audio.src = url;
            document.getElementById('musicPlayerContainer').classList.remove('hidden');
            activeMedia = audio;
        }

        function togglePlay() {
            if(room.role === 'MEMBER') return showToast("Host controls playback!");
            if(!activeMedia) return;
            
            if(activeMedia === 'youtube') {
                if(isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
            } else {
                if(isPlaying) activeMedia.pause(); else activeMedia.play();
            }
            isPlaying = !isPlaying;
            document.getElementById('playPauseBtn').innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
        }

        function onYtStateChange(e) {
            isPlaying = (e.data === YT.PlayerState.PLAYING);
            document.getElementById('playPauseBtn').innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
        }

        // --- SYNCHRONIZATION STRICT MEMBER SNAPBACK ---
        function scrubTimeline(e) {
            if(room.role === 'MEMBER') {
                // Member constraint requirement
                showToast("Host controls playback! Snapping back to live sync.");
                return; 
            }
            if(!activeMedia) return;
            
            const track = document.getElementById('progressTrack');
            const rect = track.getBoundingClientRect();
            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            
            if(activeMedia === 'youtube') {
                const dur = ytPlayer.getDuration();
                ytPlayer.seekTo(pct * dur, true);
            } else {
                activeMedia.currentTime = pct * activeMedia.duration;
            }
        }

        function updateProgress() {
            if(!activeMedia) return;
            let cur = 0, dur = 0;
            
            if(activeMedia === 'youtube' && ytPlayer && ytPlayer.getCurrentTime) {
                cur = ytPlayer.getCurrentTime(); dur = ytPlayer.getDuration();
            } else if(activeMedia.currentTime !== undefined) {
                cur = activeMedia.currentTime; dur = activeMedia.duration;
            }
            
            if(dur > 0) {
                document.getElementById('progressFill').style.width = `${(cur/dur)*100}%`;
                document.getElementById('currentTimeUI').textContent = formatTime(cur);
                document.getElementById('durationUI').textContent = formatTime(dur);
            }
        }

        function formatTime(s) { const m=Math.floor(s/60); const sc=Math.floor(s%60); return `${m}:${sc<10?'0':''}${sc}`; }

        // --- SOCIAL (CHAT & EMOJI) ---
        function sendEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'floating-reaction';
            el.textContent = emoji;
            el.style.left = (Math.random() * 80 + 10) + '%';
            document.getElementById('reactionArea').appendChild(el);
            
            setTimeout(() => el.remove(), 2000);
            
            // Mock sending to peers
            addSystemMessage(`${user.name} sent ${emoji}`);
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if(!text) return;
            
            const box = document.getElementById('chatBox');
            box.innerHTML += `<div><span class="font-bold ${user.isVip ? 'text-pink-400' : 'text-cyan-400'}">${user.name}:</span> <span class="text-white">${text}</span></div>`;
            input.value = '';
            box.scrollTop = box.scrollHeight;
        }

        function addSystemMessage(msg) {
            const box = document.getElementById('chatBox');
            box.innerHTML += `<div class="text-[10px] text-gray-500 font-mono text-center my-1">${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
