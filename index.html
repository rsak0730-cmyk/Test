<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncPlay Premium</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Animations & Styles */
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .vip-text { 
            background: linear-gradient(90deg, #ff007f, #7928ca, #00d2ff); 
            background-size: 200% auto;
            color: transparent; 
            -webkit-background-clip: text; 
            animation: shine 3s linear infinite; 
        }
        @keyframes shine { to { background-position: 200% center; } }
        .float-emoji { animation: floatUp 2s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-100px) scale(1.5); opacity: 0; } }
        
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Mock Data ---
        const AVATARS = ['🤖 Cyberpunk', '🧑‍🚀 Space Explorer', '🥷 Neon Warrior', '👾 Pixel Char', '🌌 Cosmic'];
        const ACHIEVEMENTS = [
            { id: 1, title: 'NIGHT OWL', desc: 'Host a room after 2 AM', unlocked: true },
            { id: 2, title: 'MUSIC LOVER', desc: '100 mins in Music Rooms', unlocked: false },
            { id: 3, title: 'WATCH PARTY', desc: 'Host multiple members', unlocked: true },
            // ... Add remaining up to 25
        ];
        const REDEEM_CODES = {
            'EDIT.OG_': { type: 'vip', reward: 'VIP BADGE & RGB NAME' },
            'EDIT.NEON_02': { type: 'theme', reward: 'Neon Profile Frame' },
            'EDIT.CROWN_06': { type: 'deco', reward: 'Crown Decoration' }
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('MAIN');
            const [user, setUser] = useState({
                name: 'Guest',
                deviceId: '',
                isVip: false,
                avatar: AVATARS[0],
                frame: 'none'
            });
            const [room, setRoom] = useState(null); // null, 'creating', or { code, type, role, members }

            // Initialize Device ID
            useEffect(() => {
                let id = localStorage.getItem('deviceId');
                if (!id) {
                    id = 'EDIT-' + Math.random().toString(36).substr(2, 4).toUpperCase() + '-' + Math.random().toString(36).substr(2, 4).toUpperCase();
                    localStorage.setItem('deviceId', id);
                }
                setUser(prev => ({ ...prev, deviceId: id, name: `User_${id.split('-')[1]}` }));
            }, []);

            return (
                <div className="h-full flex flex-col relative bg-slate-900 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-800 via-slate-900 to-black">
                    {/* Content Area */}
                    <div className="flex-1 overflow-y-auto pb-20">
                        {room && room !== 'creating' ? (
                            <RoomView room={room} setRoom={setRoom} user={user} />
                        ) : activeTab === 'MAIN' ? (
                            <MainTab roomState={room} setRoom={setRoom} user={user} />
                        ) : (
                            <SettingsTab user={user} setUser={setUser} />
                        )}
                    </div>

                    {/* Bottom Navigation */}
                    {!room || room === 'creating' ? (
                        <div className="absolute bottom-0 w-full glass rounded-t-3xl flex justify-around p-4 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
                            <button onClick={() => setActiveTab('MAIN')} className={`flex flex-col items-center ${activeTab === 'MAIN' ? 'text-cyan-400' : 'text-gray-400'}`}>
                                <span className="text-2xl">🏠</span>
                                <span className="text-xs font-bold mt-1">MAIN</span>
                            </button>
                            <button onClick={() => setActiveTab('SETTINGS')} className={`flex flex-col items-center ${activeTab === 'SETTINGS' ? 'text-cyan-400' : 'text-gray-400'}`}>
                                <span className="text-2xl">⚙️</span>
                                <span className="text-xs font-bold mt-1">SETTINGS</span>
                            </button>
                        </div>
                    ) : null}
                </div>
            );
        };

        const MainTab = ({ roomState, setRoom, user }) => {
            const [joinCode, setJoinCode] = useState('');

            if (roomState === 'creating') {
                return (
                    <div className="p-6 h-full flex flex-col animate-[fadeIn_0.3s_ease-out]">
                        <button onClick={() => setRoom(null)} className="text-gray-400 mb-6 text-left">← Back</button>
                        <h2 className="text-2xl font-bold mb-6 text-white text-center">Select Room Type</h2>
                        <div className="grid gap-6">
                            {[
                                { type: 'MUSIC', icon: '🎵', desc: 'Sync audio & chill' },
                                { type: 'MOVIE', icon: '🎬', desc: 'Watch local files together' },
                                { type: 'YOUTUBE', icon: '▶️', desc: 'Stream YT videos in sync' }
                            ].map(rt => (
                                <button 
                                    key={rt.type}
                                    onClick={() => setRoom({ code: Math.random().toString(36).substr(2, 6).toUpperCase(), type: rt.type, role: 'HOST', members: [user.name] })}
                                    className="glass p-6 rounded-2xl flex items-center gap-4 hover:bg-white/10 transition-colors relative overflow-hidden group"
                                >
                                    <div className="text-4xl">{rt.icon}</div>
                                    <div className="text-left">
                                        <h3 className="text-xl font-bold text-white group-hover:text-cyan-400 transition-colors">{rt.type} ROOM</h3>
                                        <p className="text-gray-400 text-sm">{rt.desc}</p>
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-6">
                    <div className="flex justify-between items-center mb-8 pt-4">
                        <h1 className="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">SYNCPLAY</h1>
                        <div className="glass px-3 py-1 rounded-full flex items-center gap-2">
                            <span>{user.avatar.split(' ')[0]}</span>
                            <span className={`font-bold text-sm ${user.isVip ? 'vip-text' : 'text-white'}`}>{user.name}</span>
                        </div>
                    </div>

                    <div className="space-y-6">
                        <button 
                            onClick={() => setRoom('creating')}
                            className="w-full bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold py-4 rounded-2xl shadow-[0_0_20px_rgba(8,145,178,0.4)] active:scale-95 transition-transform"
                        >
                            + CREATE ROOM
                        </button>

                        <div className="glass p-6 rounded-2xl text-center space-y-4">
                            <h3 className="text-gray-300 font-bold tracking-wide text-sm">JOIN ROOM</h3>
                            <input 
                                type="text" 
                                placeholder="Enter Room Code" 
                                value={joinCode}
                                onChange={(e) => setJoinCode(e.target.value.toUpperCase())}
                                className="w-full bg-black/50 border border-gray-600 rounded-xl p-3 text-center text-xl text-white font-mono tracking-[0.2em] focus:outline-none focus:border-cyan-400"
                            />
                            <button 
                                onClick={() => joinCode.length > 3 && setRoom({ code: joinCode, type: 'YOUTUBE', role: 'MEMBER', members: ['HostUser', user.name] })}
                                className="w-full bg-white/10 hover:bg-white/20 text-white font-bold py-3 rounded-xl transition-colors"
                            >
                                JOIN
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const RoomView = ({ room, setRoom, user }) => {
            const [progress, setProgress] = useState(30);
            const [chat, setChat] = useState([]);
            const [msg, setMsg] = useState('');
            const [reactions, setReactions] = useState([]);

            // Member snap-back logic simulation
            const handleSeek = (e) => {
                if (room.role === 'MEMBER') {
                    alert("Host controls playback! Snapping back to sync point.");
                    e.target.value = 30; // Snap back
                } else {
                    setProgress(e.target.value);
                }
            };

            const sendReaction = (emoji) => {
                const id = Date.now();
                setReactions(prev => [...prev, { id, emoji }]);
                setTimeout(() => setReactions(prev => prev.filter(r => r.id !== id)), 2000);
            };

            return (
                <div className="h-full flex flex-col bg-black">
                    {/* Header */}
                    <div className="glass px-4 py-3 flex justify-between items-center z-10">
                        <button onClick={() => setRoom(null)} className="text-red-400 font-bold text-sm bg-red-400/10 px-3 py-1 rounded-lg">LEAVE</button>
                        <div className="text-center">
                            <div className="text-xs text-cyan-400 font-bold tracking-widest">{room.type} ROOM</div>
                            <div className="text-white font-mono font-bold tracking-widest">{room.code}</div>
                        </div>
                        <div className="text-gray-400 text-sm font-bold flex items-center gap-1">
                            👥 {room.members.length}
                        </div>
                    </div>

                    {/* Media Area */}
                    <div className="w-full aspect-video bg-gray-900 relative flex flex-col justify-center items-center border-b border-white/10 overflow-hidden">
                        {room.type === 'MUSIC' ? (
                            <div className="w-32 h-32 rounded-2xl bg-gradient-to-tr from-purple-500 to-cyan-500 shadow-[0_0_40px_rgba(168,85,247,0.4)] animate-pulse"></div>
                        ) : room.type === 'MOVIE' ? (
                            <div className="text-gray-500 font-bold">Local File Playing...</div>
                        ) : (
                            <div className="text-gray-500 font-bold">YouTube Video Syncing...</div>
                        )}
                        
                        {/* Floating Reactions overlay */}
                        <div className="absolute inset-0 pointer-events-none flex justify-center items-end pb-10">
                            {reactions.map(r => (
                                <div key={r.id} className="text-4xl float-emoji absolute">{r.emoji}</div>
                            ))}
                        </div>
                    </div>

                    {/* Sync Status & Timeline */}
                    <div className="px-4 py-3 bg-gray-900/50">
                        <div className="flex justify-between text-xs font-bold mb-2">
                            <span className="text-green-400 flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span> SYNCED (18ms)</span>
                            <span className="text-gray-400">{room.role === 'HOST' ? '👑 HOST' : '👤 MEMBER'}</span>
                        </div>
                        <input 
                            type="range" 
                            min="0" max="100" 
                            value={progress} 
                            onChange={handleSeek}
                            className={`w-full h-2 rounded-lg appearance-none bg-gray-700 ${room.role === 'MEMBER' ? 'cursor-not-allowed' : 'cursor-pointer'}`}
                        />
                    </div>

                    {/* Chat & Controls */}
                    <div className="flex-1 flex flex-col p-4 overflow-hidden relative">
                        <div className="flex-1 overflow-y-auto space-y-3 mb-16">
                            {chat.map((c, i) => (
                                <div key={i} className="text-sm">
                                    <span className="font-bold text-gray-400">{c.sender}: </span>
                                    <span className="text-white">{c.text}</span>
                                </div>
                            ))}
                        </div>

                        {/* Reaction Bar */}
                        <div className="absolute bottom-16 left-0 w-full px-4 flex justify-between">
                            {['❤️', '😂', '🔥', '😮', '👏'].map(emoji => (
                                <button key={emoji} onClick={() => sendReaction(emoji)} className="text-2xl hover:scale-125 transition-transform active:scale-90">{emoji}</button>
                            ))}
                        </div>

                        {/* Chat Input */}
                        <div className="absolute bottom-4 left-4 right-4 flex gap-2">
                            <input 
                                type="text" 
                                value={msg}
                                onChange={(e) => setMsg(e.target.value)}
                                placeholder="Chat..."
                                className="flex-1 bg-white/10 rounded-xl px-4 py-2 text-white focus:outline-none focus:ring-1 focus:ring-cyan-400"
                                onKeyPress={(e) => {
                                    if(e.key === 'Enter' && msg) {
                                        setChat([...chat, {sender: user.name, text: msg}]);
                                        setMsg('');
                                    }
                                }}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const SettingsTab = ({ user, setUser }) => {
            const [code, setCode] = useState('');
            
            const handleRedeem = () => {
                const reward = REDEEM_CODES[code.toUpperCase()];
                if (reward) {
                    if (reward.type === 'vip') setUser(prev => ({ ...prev, isVip: true }));
                    alert(`Redeemed successfully: ${reward.reward}`);
                } else {
                    alert('Invalid Code');
                }
                setCode('');
            };

            return (
                <div className="p-6 pb-24 space-y-6 animate-[fadeIn_0.2s_ease-out]">
                    <h2 className="text-2xl font-bold text-white">Profile</h2>
                    
                    {/* Profile Card */}
                    <div className="glass p-6 rounded-2xl relative overflow-hidden">
                        {user.isVip && <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500"></div>}
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 rounded-2xl bg-gray-800 flex items-center justify-center text-3xl shadow-inner border border-white/10">
                                {user.avatar.split(' ')[0]}
                            </div>
                            <div>
                                <h3 className={`text-xl font-black ${user.isVip ? 'vip-text' : 'text-white'}`}>{user.name}</h3>
                                <p className="text-xs text-gray-400 font-mono mt-1">@{user.deviceId}</p>
                                {user.isVip && <span className="inline-block mt-2 text-xs font-bold bg-white/10 px-2 py-1 rounded text-cyan-400 border border-cyan-400/30">💎 VIP</span>}
                            </div>
                        </div>
                    </div>

                    {/* Redeem Code */}
                    <div className="glass p-4 rounded-xl space-y-3">
                        <h4 className="text-sm font-bold text-gray-400 uppercase tracking-wider">Redeem Reward Code</h4>
                        <div className="flex gap-2">
                            <input 
                                type="text" 
                                value={code}
                                onChange={(e) => setCode(e.target.value)}
                                placeholder="Enter code (e.g. EDIT.OG_)"
                                className="flex-1 bg-black/50 rounded-lg px-3 py-2 text-white font-mono text-sm border border-gray-700 focus:outline-none focus:border-cyan-400"
                            />
                            <button onClick={handleRedeem} className="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-lg text-sm transition-colors">
                                REDEEM
                            </button>
                        </div>
                    </div>

                    {/* Categories / Achievements */}
                    <div className="space-y-4">
                        <h4 className="text-sm font-bold text-gray-400 uppercase tracking-wider">Unlocked Categories</h4>
                        <div className="grid grid-cols-2 gap-3">
                            {ACHIEVEMENTS.filter(a => a.unlocked).map(a => (
                                <div key={a.id} className="glass p-3 rounded-xl border-l-2 border-l-cyan-400">
                                    <div className="text-xs font-bold text-white truncate">{a.title}</div>
                                    <div className="text-[10px] text-gray-400 mt-1 truncate">{a.desc}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
