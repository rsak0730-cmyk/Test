<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncBeat - Unified Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { position: fixed; inset: 0; width: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        
        #slider { display: flex; width: 400%; height: 100dvh; transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform; }
        .frame-wrapper { width: 25%; height: 100dvh; position: relative; flex-shrink: 0; transform: translateZ(0); }
        .frame-wrapper.inactive { visibility: hidden !important; pointer-events: none !important; }
        iframe { width: 100%; height: 100%; border: none; background: #000; display: block; }

        .tab-bar { position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(0); width: 90%; max-width: 360px; height: 60px; background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(25px) saturate(200%); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.2); z-index: 10000; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease; }
        .tab-bar.hide { transform: translateX(-50%) translateY(120px); opacity: 0; pointer-events: none; }
        .indicator { position: absolute; top: 4px; bottom: 4px; width: calc(25% - 8px); left: 4px; background: rgba(239, 68, 68, 0.25); border-radius: 24px; transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease; z-index: 1; }
        .tab-btn { flex: 1; height: 100%; border: none; background: transparent; color: rgba(255, 255, 255, 0.4); font-size: 10px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; z-index: 2; cursor: pointer; transition: color 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; position: relative; }
        .tab-btn i { font-size: 18px; transition: transform 0.3s cubic-bezier(0.2, 2, 0.4, 1); }
        .tab-btn.active { color: #fff; }
        .tab-btn.active i { transform: translateY(-2px) scale(1.1); }
        .tab-btn .lock { position: absolute; top: 6px; right: 12px; font-size: 9px; color: #ef4444; opacity: 0; transition: 0.3s ease; }
        .tab-bar.locked .tab-btn:not(.active) .lock { opacity: 1; }
        .tab-bar.locked { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }

        #toast { position: fixed; top: max(25px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-120px); background: rgba(20, 8, 8, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(239, 68, 68, 0.6); color: #fecaca; padding: 12px 20px; border-radius: 20px; font-size: 12px; font-weight: 800; box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 100000; display: flex; align-items: center; gap: 8px; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none; text-align: center; }
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* --- GLOBAL FAB STYLES --- */
        #globalFab {
            position: fixed; right: 20px; bottom: 100px; width: 56px; height: 56px;
            background: linear-gradient(135deg, #ef4444, #b91c1c); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 24px; box-shadow: 0 8px 25px rgba(239, 68, 68, 0.6);
            z-index: 999999; cursor: pointer; transition: transform 0.2s; touch-action: none;
        }
        #globalFab:active { transform: scale(0.9); }
        #globalFab.hidden { display: none; }

        /* --- GLOBAL ACTION MENU MODAL --- */
        #fabActionModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 1000000; display: flex; flex-direction: column; justify-content: flex-end;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #fabActionModal.show { transform: translateY(0); }
        
        .fab-modal-content {
            background: #121216; border-top-left-radius: 24px; border-top-right-radius: 24px;
            height: 80dvh; display: flex; flex-direction: column; border-top: 1px solid #27272a;
        }
        .fab-modal-header {
            display: flex; justify-content: space-between; align-items: center; padding: 16px 20px;
            border-bottom: 1px solid #27272a;
        }
        .fab-modal-title { font-size: 18px; font-weight: 800; color: #fff; }
        .fab-modal-close { background: #27272a; border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Tabs inside Modal */
        .fab-tabs { display: flex; padding: 10px 20px; gap: 10px; background: #09090b; }
        .fab-tab-btn { flex: 1; padding: 12px; background: #18181b; border: 1px solid #27272a; border-radius: 12px; color: #9ca3af; font-weight: 800; font-size: 13px; text-align: center; cursor: pointer; }
        .fab-tab-btn.active { background: #ef4444; color: #fff; border-color: #ef4444; }

        /* Soundboard & Emojis Scroll Areas */
        .fab-pane { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .fab-pane.active { display: block; }
        
        .search-box { width: 100%; background: #000; border: 1px solid #3f3f46; color: #fff; padding: 14px; border-radius: 12px; font-size: 14px; outline: none; margin-bottom: 15px; }
        .search-box:focus { border-color: #ef4444; }

        .sound-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .sound-btn { background: #18181b; border: 1px solid #3f3f46; color: #e4e4e7; padding: 10px 6px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; cursor: pointer; }
        .sound-btn:active { background: #ef4444; border-color: #ef4444; }
        
        .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .emoji-btn { background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 8px; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .emoji-btn:active { transform: scale(1.1); background: #ef4444; }
    </style>
</head>
<body>

    <div id="toast"><i class="fa-solid fa-lock" style="color: #ef4444;"></i> <span id="toastMsg"></span></div>

    <!-- 4 Tabs Setup -->
    <div id="slider">
        <div class="frame-wrapper" id="wrapper-0"><iframe id="frame-0" src="./movies.html" allow="autoplay; fullscreen"></iframe></div>
        <div class="frame-wrapper inactive" id="wrapper-1"><iframe id="frame-1" data-src="./golden.html" allow="autoplay; fullscreen"></iframe></div>
        <div class="frame-wrapper inactive" id="wrapper-2"><iframe id="frame-2" data-src="./audio.html" allow="autoplay; fullscreen"></iframe></div>
        <div class="frame-wrapper inactive" id="wrapper-3"><iframe id="frame-3" data-src="./settings.html" allow="autoplay; fullscreen"></iframe></div>
    </div>

    <!-- Navigation -->
    <nav class="tab-bar" id="tabBar">
        <div class="indicator" id="indicator"></div>
        <button class="tab-btn active" onclick="switchTab(0, '#ef4444')"><i class="fa-solid fa-film"></i><span>Movies</span><i class="fa-solid fa-lock lock"></i></button>
        <button class="tab-btn" onclick="switchTab(1, '#fbbf24')"><i class="fa-brands fa-youtube"></i><span>Golden</span><i class="fa-solid fa-lock lock"></i></button>
        <button class="tab-btn" onclick="switchTab(2, '#a855f7')"><i class="fa-solid fa-compact-disc"></i><span>Audio</span><i class="fa-solid fa-lock lock"></i></button>
        <button class="tab-btn" onclick="switchTab(3, '#3b82f6')"><i class="fa-solid fa-gear"></i><span>Settings</span><i class="fa-solid fa-lock lock"></i></button>
    </nav>

    <!-- GLOBAL DRAGGABLE FAB -->
    <div id="globalFab" onclick="openFabModal()"><i class="fa-solid fa-bolt"></i></div>

    <!-- FAB MODAL (SOUNDBOARD & EMOJIS) -->
    <div id="fabActionModal">
        <div class="fab-modal-content">
            <div class="fab-modal-header">
                <div class="fab-modal-title">Reactions Studio</div>
                <button class="fab-modal-close" onclick="closeFabModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="fab-tabs">
                <div class="fab-tab-btn active" id="tabSoundsBtn" onclick="switchFabTab('sounds')"><i class="fa-solid fa-volume-high"></i> Sounds</div>
                <div class="fab-tab-btn" id="tabEmojisBtn" onclick="switchFabTab('emojis')"><i class="fa-solid fa-face-smile"></i> Emojis</div>
            </div>

            <!-- Soundboard Pane -->
            <div id="paneSounds" class="fab-pane active">
                <input type="text" id="soundSearch" class="search-box" placeholder="Search 1000+ sounds..." oninput="filterSounds(this.value)">
                <div id="dynamicSoundGrid" class="sound-grid"></div>
            </div>

            <!-- Emoji Pane -->
            <div id="paneEmojis" class="fab-pane">
                <div id="dynamicEmojiGrid" class="emoji-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // === TABS & ROUTING ===
        let currentTab = 0;
        let activeRoomTab = null;
        let activeRoomCode = null;

        const slider = document.getElementById('slider');
        const indicator = document.getElementById('indicator');
        const tabBar = document.getElementById('tabBar');
        const toast = document.getElementById('toast');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const wrappers = [document.getElementById('wrapper-0'), document.getElementById('wrapper-1'), document.getElementById('wrapper-2'), document.getElementById('wrapper-3')];
        const frames = [document.getElementById('frame-0'), document.getElementById('frame-1'), document.getElementById('frame-2'), document.getElementById('frame-3')];

        // Global Event Bus
        window.addEventListener('message', (e) => {
            const data = e.data;
            if (data.sender === 'syncbeat_settings') {
                if (data.action === 'PROFILE_UPDATED') {
                    frames.forEach((f, i) => { if (i !== 3 && f.contentWindow) f.contentWindow.postMessage(data, '*'); });
                }
                if (data.action === 'TOGGLE_FAB') {
                    document.getElementById('globalFab').classList.toggle('hidden', !data.state);
                }
                return;
            }
            if (data.sender !== 'syncbeat') return;
            if (data.action === 'ROOM_OPENED') { activeRoomTab = data.tab; activeRoomCode = data.code; tabBar.classList.add('locked'); }
            else if (data.action === 'ROOM_CLOSED') { activeRoomTab = null; activeRoomCode = null; tabBar.classList.remove('locked'); tabBar.classList.remove('hide'); }
            else if (data.action === 'MEDIA_PLAYING') { tabBar.classList.add('hide'); }
            else if (data.action === 'MEDIA_PAUSED') { tabBar.classList.remove('hide'); }
        });

        window.addEventListener('click', () => {
            if (tabBar.classList.contains('hide')) {
                tabBar.classList.remove('hide');
                setTimeout(() => { if (activeRoomTab !== null) tabBar.classList.add('hide'); }, 3000);
            }
        });

        function switchTab(index, color) {
            if (activeRoomTab !== null && activeRoomTab !== index) {
                toast.querySelector('#toastMsg').textContent = `Active Room in Tab ${activeRoomTab+1}. Close it first!`;
                toast.classList.add('show');
                tabBar.style.transform = 'translateX(-50%) scale(0.95)';
                setTimeout(() => tabBar.style.transform = 'translateX(-50%) scale(1)', 150);
                setTimeout(() => toast.classList.remove('show'), 3500);
                return;
            }
            if (frames[currentTab].contentWindow) frames[currentTab].contentWindow.postMessage({ sender: 'syncbeat_hub', action: 'TAB_BACKGROUND' }, '*');
            const targetFrame = frames[index];
            if (!targetFrame.src && targetFrame.getAttribute('data-src')) targetFrame.src = targetFrame.getAttribute('data-src');
            wrappers.forEach((wrap, i) => wrap.classList.toggle('inactive', i !== index));
            currentTab = index;
            slider.style.transform = `translateX(-${index * 25}%)`;
            indicator.style.left = ['4px', 'calc(25% + 4px)', 'calc(50% + 4px)', 'calc(75% + 4px)'][index];
            indicator.style.background = color + '40';
            tabBtns.forEach((btn, i) => { btn.classList.toggle('active', i === index); btn.style.color = i === index ? '#fff' : 'rgba(255,255,255,0.4)'; });
            if (targetFrame.contentWindow) targetFrame.contentWindow.postMessage({ sender: 'syncbeat_hub', action: 'TAB_FOREGROUND' }, '*');
        }

        // === GLOBAL FAB DRAG LOGIC ===
        const fab = document.getElementById('globalFab');
        let isDragging = false, startX, startY, initialX, initialY;

        // Load FAB Preference
        if(localStorage.getItem('syncbeat_global_fab') === 'false') fab.classList.add('hidden');

        fab.addEventListener('touchstart', dragStart, {passive: false});
        fab.addEventListener('mousedown', dragStart);

        function dragStart(e) {
            isDragging = false;
            startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            initialX = fab.offsetLeft;
            initialY = fab.offsetTop;
            document.addEventListener(e.type.includes('mouse') ? 'mousemove' : 'touchmove', dragMove, {passive: false});
            document.addEventListener(e.type.includes('mouse') ? 'mouseup' : 'touchend', dragEnd);
        }

        function dragMove(e) {
            const currentX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            const dx = currentX - startX;
            const dy = currentY - startY;

            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isDragging = true;
            
            if (isDragging) {
                e.preventDefault();
                let newX = initialX + dx;
                let newY = initialY + dy;
                // Boundaries
                newX = Math.max(0, Math.min(newX, window.innerWidth - 56));
                newY = Math.max(0, Math.min(newY, window.innerHeight - 56));
                fab.style.left = `${newX}px`;
                fab.style.top = `${newY}px`;
                fab.style.right = 'auto';
                fab.style.bottom = 'auto';
            }
        }

        function dragEnd(e) {
            document.removeEventListener('mousemove', dragMove); document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('mouseup', dragEnd); document.removeEventListener('touchend', dragEnd);
        }

        // === MODAL LOGIC ===
        const modal = document.getElementById('fabActionModal');
        function openFabModal() { if (!isDragging) modal.classList.add('show'); }
        function closeFabModal() { modal.classList.remove('show'); }

        function switchFabTab(tab) {
            document.getElementById('tabSoundsBtn').classList.toggle('active', tab === 'sounds');
            document.getElementById('tabEmojisBtn').classList.toggle('active', tab === 'emojis');
            document.getElementById('paneSounds').classList.toggle('active', tab === 'sounds');
            document.getElementById('paneEmojis').classList.toggle('active', tab === 'emojis');
        }

        // === TRANSMIT TO IFRAME ===
        function fireActionToActiveTab(type, payload) {
            if (frames[currentTab] && frames[currentTab].contentWindow) {
                frames[currentTab].contentWindow.postMessage({ sender: 'syncbeat_hub', action: type, data: payload }, '*');
            }
            closeFabModal();
        }

        // === 1000+ DYNAMIC SOUNDBOARD GENERATOR ===
        const baseSounds = [
            {id:'airhorn', icon:'🎺', name:'Airhorn'}, {id:'cricket', icon:'🦗', name:'Cricket'}, {id:'wow', icon:'😲', name:'Wow'},
            {id:'boom', icon:'💥', name:'Vine Boom'}, {id:'hitmarker', icon:'🎯', name:'Hitmarker'}, {id:'cheer', icon:'🙌', name:'Cheer'},
            {id:'bruh', icon:'🤦', name:'Bruh'}, {id:'error', icon:'❌', name:'Error'}, {id:'tada', icon:'🎉', name:'Tada'},
            {id:'fart', icon:'💨', name:'Poot'}, {id:'sadviolin', icon:'🎻', name:'Sad Violin'}, {id:'punch', icon:'👊', name:'Punch'},
            {id:'yay', icon:'🎊', name:'Yay'}, {id:'oof', icon:'💀', name:'Oof'}, {id:'cash', icon:'💰', name:'Cha-Ching'},
            {id:'evil', icon:'😈', name:'Evil Laugh'}, {id:'victory', icon:'🏆', name:'Victory'}, {id:'fail', icon:'📉', name:'Fail'}
        ];
        
        let masterSoundList = [...baseSounds];
        // Programmatically generate the "1000+ Sounds" for demonstration scalability
        for(let i = 1; i <= 982; i++) {
            masterSoundList.push({ id: `sound_${i}`, icon: '🎵', name: `Effect Library #${i}` });
        }

        function renderSounds(list) {
            const grid = document.getElementById('dynamicSoundGrid');
            grid.innerHTML = '';
            // Render top 50 matches for performance
            list.slice(0, 50).forEach(sound => {
                const btn = document.createElement('button');
                btn.className = 'sound-btn';
                btn.innerHTML = `${sound.icon}<br>${sound.name}`;
                btn.onclick = () => fireActionToActiveTab('TRIGGER_SOUND', sound.id);
                grid.appendChild(btn);
            });
        }
        function filterSounds(query) {
            const q = query.toLowerCase();
            const filtered = masterSoundList.filter(s => s.name.toLowerCase().includes(q));
            renderSounds(filtered);
        }

        // === MASSIVE EMOJI GRID GENERATOR ===
        function generateEmojis() {
            const grid = document.getElementById('dynamicEmojiGrid');
            // Standard Emoji Unicode Ranges (Smileys, Gestures, Animals, Food, etc)
            const ranges = [
                [0x1F600, 0x1F64F], // Emoticons
                [0x1F300, 0x1F5FF], // Misc Symbols & Pictographs
                [0x1F680, 0x1F6FF], // Transport & Map
                [0x1F900, 0x1F9FF], // Supplemental Emojis
                [0x2600, 0x26FF]    // Misc symbols
            ];
            
            let html = '';
            ranges.forEach(range => {
                for (let i = range[0]; i <= range[1]; i++) {
                    const char = String.fromCodePoint(i);
                    // Filter out non-rendering chars roughly
                    if(char.trim().length > 0) {
                        html += `<div class="emoji-btn" onclick="fireActionToActiveTab('TRIGGER_EMOJI', '${char}')">${char}</div>`;
                    }
                }
            });
            grid.innerHTML = html;
        }

        // Initialize Data
        renderSounds(masterSoundList);
        // Defer emoji generation slightly to avoid blocking initial render
        setTimeout(generateEmojis, 500);

    </script>
</body>
</html>
