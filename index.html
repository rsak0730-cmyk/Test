<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SyncBeat - Unified Hub</title>
    <meta name="description" content="Multi-Device Real-Time Room Synchronization and Watch Party platform for movies, YouTube, and music.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        /* Updated for 4 tabs (400% width) */
        #slider { 
            display: flex; 
            width: 400%; 
            height: 100dvh; 
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); 
            will-change: transform; 
        }
        
        /* Updated frame size to 25% */
        .frame-wrapper { 
            width: 25%; 
            height: 100dvh; 
            position: relative; 
            flex-shrink: 0;
            transform: translateZ(0); /* Hardware acceleration */
        }

        /* Inactive Tab Culling: Tells the GPU not to rasterize hidden tabs */
        .frame-wrapper.inactive {
            visibility: hidden !important;
            pointer-events: none !important;
        }
        
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            background: #000; 
            display: block;
        }

        .tab-bar {
            position: absolute; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%) translateY(0);
            width: 90%; max-width: 360px; height: 60px;
            background: rgba(18, 18, 22, 0.85); backdrop-filter: blur(25px) saturate(200%); -webkit-backdrop-filter: blur(25px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 30px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            z-index: 10000; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
        }

        .tab-bar.hide { transform: translateX(-50%) translateY(120px); opacity: 0; pointer-events: none; }

        /* Adjusted indicator width for 4 tabs */
        .indicator {
            position: absolute; top: 4px; bottom: 4px; width: calc(25% - 8px); left: 4px;
            background: rgba(239, 68, 68, 0.25); border-radius: 24px;
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s ease; z-index: 1;
        }

        .tab-btn {
            flex: 1; height: 100%; border: none; background: transparent; color: rgba(255, 255, 255, 0.4);
            font-size: 10px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            z-index: 2; cursor: pointer; transition: color 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; position: relative;
        }

        .tab-btn i { font-size: 18px; transition: transform 0.3s cubic-bezier(0.2, 2, 0.4, 1); }
        .tab-btn.active { color: #fff; }
        .tab-btn.active i { transform: translateY(-2px) scale(1.1); }
        
        .tab-btn .lock { position: absolute; top: 6px; right: 12px; font-size: 9px; color: #ef4444; opacity: 0; transition: 0.3s ease; }
        .tab-bar.locked .tab-btn:not(.active) .lock { opacity: 1; }
        .tab-bar.locked { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }

        #toast {
            position: fixed; top: max(25px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-120px);
            background: rgba(20, 8, 8, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(239, 68, 68, 0.6);
            color: #fecaca; padding: 12px 20px; border-radius: 20px; font-size: 12px; font-weight: 800;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 100000; display: flex; align-items: center; gap: 8px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none; text-align: center;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        #videoSplashOverlay {
            position: fixed; inset: 0; width: 100%; height: 100dvh; background-color: #000000;
            z-index: 99999999; display: flex; align-items: center; justify-content: center;
            overflow: hidden; transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s ease;
        }
        #videoSplashOverlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
        #splashVideo { width: 100%; height: 100%; object-fit: cover; background: #000; }
        #skipSplashBtn {
            position: absolute; top: max(40px, env(safe-area-inset-top)); right: 20px;
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25); color: #ffffff; font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; padding: 8px 16px; border-radius: 20px;
            cursor: pointer; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="videoSplashOverlay">
        <video id="splashVideo" autoplay muted playsinline preload="auto">
            <source src="intro.mp4" type="video/mp4">
        </video>
        <button id="skipSplashBtn" onclick="dismissSplashScreen()">Skip</button>
    </div>

    <div id="toast"><i class="fa-solid fa-lock" style="color: #ef4444;"></i> <span id="toastMsg"></span></div>

    <!-- 4 Tabs now -->
    <div id="slider">
        <div class="frame-wrapper" id="wrapper-0">
            <iframe id="frame-0" src="./movies.html" allow="autoplay; fullscreen; bluetooth; camera; microphone; display-capture"></iframe>
        </div>
        <div class="frame-wrapper inactive" id="wrapper-1">
            <iframe id="frame-1" data-src="./golden.html" allow="autoplay; fullscreen; bluetooth; camera; microphone; display-capture"></iframe>
        </div>
        <div class="frame-wrapper inactive" id="wrapper-2">
            <iframe id="frame-2" data-src="./audio.html" allow="autoplay; fullscreen; bluetooth; camera; microphone; display-capture"></iframe>
        </div>
        <!-- NEW Settings Tab -->
        <div class="frame-wrapper inactive" id="wrapper-3">
            <iframe id="frame-3" data-src="./settings.html" allow="autoplay; fullscreen; bluetooth; camera; microphone; display-capture"></iframe>
        </div>
    </div>

    <!-- 4 Buttons now -->
    <nav class="tab-bar" id="tabBar">
        <div class="indicator" id="indicator"></div>
        <button class="tab-btn active" onclick="switchTab(0, '#ef4444')">
            <i class="fa-solid fa-film"></i><span>Movies</span><i class="fa-solid fa-lock lock"></i>
        </button>
        <button class="tab-btn" onclick="switchTab(1, '#fbbf24')">
            <i class="fa-brands fa-youtube"></i><span>Golden</span><i class="fa-solid fa-lock lock"></i>
        </button>
        <button class="tab-btn" onclick="switchTab(2, '#a855f7')">
            <i class="fa-solid fa-compact-disc"></i><span>Audio</span><i class="fa-solid fa-lock lock"></i>
        </button>
        <button class="tab-btn" onclick="switchTab(3, '#3b82f6')">
            <i class="fa-solid fa-gear"></i><span>Settings</span><i class="fa-solid fa-lock lock"></i>
        </button>
    </nav>

    <script>
        const splashOverlay = document.getElementById('videoSplashOverlay');
        const splashVid = document.getElementById('splashVideo');

        function dismissSplashScreen() {
            if (!splashOverlay || splashOverlay.classList.contains('fade-out')) return;
            splashOverlay.classList.add('fade-out');
            setTimeout(() => {
                if (splashVid) {
                    splashVid.pause();
                    splashVid.removeAttribute('src');
                    splashVid.load();
                }
                splashOverlay.remove();
            }, 650);
        }

        if (localStorage.getItem('syncbeat_seen_intro')) {
            splashOverlay.remove();
        } else {
            localStorage.setItem('syncbeat_seen_intro', 'true');
            if (splashVid) {
                splashVid.addEventListener('ended', dismissSplashScreen);
                splashVid.addEventListener('error', dismissSplashScreen);
                setTimeout(dismissSplashScreen, 8000); 
            }
        }

        let currentTab = 0;
        let activeRoomTab = null;
        let activeRoomCode = null;

        const slider = document.getElementById('slider');
        const indicator = document.getElementById('indicator');
        const tabBar = document.getElementById('tabBar');
        const toast = document.getElementById('toast');
        const tabBtns = document.querySelectorAll('.tab-btn');
        
        // Updated arrays for 4 tabs
        const wrappers = [document.getElementById('wrapper-0'), document.getElementById('wrapper-1'), document.getElementById('wrapper-2'), document.getElementById('wrapper-3')];
        const frames = [document.getElementById('frame-0'), document.getElementById('frame-1'), document.getElementById('frame-2'), document.getElementById('frame-3')];

        let hasEnteredFullscreen = false;
        document.body.addEventListener('click', () => {
            if (!hasEnteredFullscreen) {
                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else if (document.documentElement.webkitRequestFullscreen) { 
                        document.documentElement.webkitRequestFullscreen();
                    }
                } catch(e) {}
                hasEnteredFullscreen = true;
            }
        });

        // GLOBAL MESSAGE RELAY HUB
        window.addEventListener('message', (e) => {
            const data = e.data;

            // 1. Intercept Profile Updates from Settings Tab and Broadcast to all other tabs
            if (data.sender === 'syncbeat_settings' && data.action === 'PROFILE_UPDATED') {
                frames.forEach((frame, index) => {
                    if (index !== 3 && frame.contentWindow) { // Don't send it back to settings
                        frame.contentWindow.postMessage(data, '*');
                    }
                });
                return; // Stop processing further
            }

            // 2. Handle standard room state tracking
            if (data.sender !== 'syncbeat') return;

            if (data.action === 'ROOM_OPENED') {
                activeRoomTab = data.tab;
                activeRoomCode = data.code;
                tabBar.classList.add('locked');
            } else if (data.action === 'ROOM_CLOSED') {
                activeRoomTab = null;
                activeRoomCode = null;
                tabBar.classList.remove('locked');
                tabBar.classList.remove('hide'); 
            } else if (data.action === 'MEDIA_PLAYING') {
                tabBar.classList.add('hide');
            } else if (data.action === 'MEDIA_PAUSED') {
                tabBar.classList.remove('hide');
            }
        });

        window.addEventListener('click', () => {
            if (tabBar.classList.contains('hide')) {
                tabBar.classList.remove('hide');
                setTimeout(() => { if (activeRoomTab !== null) tabBar.classList.add('hide'); }, 3000);
            }
        });

        function switchTab(index, color) {
            if (activeRoomTab !== null && activeRoomTab !== index) {
                const names = ['Streamflix', 'Golden Room', 'Audio Sync', 'Settings'];
                document.getElementById('toastMsg').textContent = `Active Room in ${names[activeRoomTab]} (${activeRoomCode}). Close it first!`;
                toast.classList.add('show');
                tabBar.style.transform = 'translateX(-50%) scale(0.95)';
                setTimeout(() => tabBar.style.transform = 'translateX(-50%) scale(1)', 150);
                setTimeout(() => toast.classList.remove('show'), 3500);
                return;
            }

            // 1. Tell the previous tab to enter background sleep mode
            if (frames[currentTab] && frames[currentTab].contentWindow) {
                try {
                    frames[currentTab].contentWindow.postMessage({ sender: 'syncbeat_hub', action: 'TAB_BACKGROUND' }, '*');
                } catch(e) {}
            }

            // 2. Lazy load the new tab if not loaded yet
            const targetFrame = frames[index];
            if (!targetFrame.src && targetFrame.getAttribute('data-src')) {
                targetFrame.src = targetFrame.getAttribute('data-src');
            }

            // 3. Update visibility and culled states
            wrappers.forEach((wrap, i) => {
                wrap.classList.toggle('inactive', i !== index);
            });

            // 4. Slide to the tab (Multiplier is now 25 for 4 tabs)
            currentTab = index;
            slider.style.transform = `translateX(-${index * 25}%)`;
            
            // Positioning array for the 4 indicators
            const pos = ['4px', 'calc(25% + 4px)', 'calc(50% + 4px)', 'calc(75% + 4px)'];
            indicator.style.left = pos[index];
            indicator.style.background = color + '40';

            tabBtns.forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
                btn.style.color = i === index ? '#fff' : 'rgba(255,255,255,0.4)';
            });

            // 5. Wake up the new tab
            if (targetFrame.contentWindow) {
                try {
                    targetFrame.contentWindow.postMessage({ sender: 'syncbeat_hub', action: 'TAB_FOREGROUND' }, '*');
                } catch(e) {}
            }
        }
    </script>
</body>
</html>
