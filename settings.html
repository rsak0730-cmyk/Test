<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncBeat - Global Settings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- VIRTUAL ROOM THEMES (Matching movies.html & golden.html) --- */
        :root {
            --bg-page: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #6b7280;
            --primary: #ef4444;
            --primary-light: #fee2e2;
            --primary-border: #fca5a5;
            --card-bg: #ffffff;
            --card-border: #fecaca;
            --input-bg: #f9fafb;
            --success: #10b981;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-page: #07070a;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --primary: #ef4444;
                --primary-light: rgba(239, 68, 68, 0.15);
                --primary-border: rgba(239, 68, 68, 0.4);
                --card-bg: #121216;
                --card-border: #27272a;
                --input-bg: #09090b;
                --success: #10b981;
            }
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px; 
            padding-bottom: 95px !important; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            overflow-x: hidden; 
        }
        
        .container { width: 100%; max-width: 420px; }
        
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
        .header i { font-size: 22px; color: var(--primary); }

        .card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 20px; 
            padding: 18px; 
            margin-bottom: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2); 
        }
        
        .card-header-sm { 
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            margin-bottom: 12px; 
            letter-spacing: 1px;
        }

        .code-input { 
            width: 100%; 
            background: var(--input-bg); 
            border: 1px solid var(--card-border); 
            padding: 14px; 
            border-radius: 12px; 
            font-size: 14px; 
            box-sizing: border-box; 
            outline: none; 
            margin-bottom: 12px; 
            font-weight: 600; 
            color: var(--text-main); 
            transition: all 0.3s ease; 
        }
        .code-input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-light); }

        .avatar-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
            margin-bottom: 16px; 
        }
        
        .avatar-btn { 
            background: var(--input-bg); 
            border: 1px solid var(--card-border); 
            border-radius: 12px; 
            padding: 12px; 
            font-size: 24px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .avatar-btn.active { 
            background: var(--primary-light); 
            border-color: var(--primary); 
            transform: scale(1.05);
        }

        .btn-purple { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            font-size: 15px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: transform 0.1s ease;
            box-shadow: 0 6px 20px var(--primary-light);
        }
        .btn-purple:active { transform: scale(0.96); }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--card-border);
        }
        .setting-row:last-child { border-bottom: none; }
        .setting-label { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .setting-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--card-border); transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        #toastModal { 
            position: fixed; 
            bottom: 25px; 
            left: 50%; 
            transform: translateX(-50%) translateY(100px); 
            background: var(--success); 
            color: #000; 
            padding: 12px 24px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 800; 
            z-index: 10000; 
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
            pointer-events: none; 
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); 
        }
        #toastModal.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <i class="fa-solid fa-gear"></i>
            <h1>Global Settings</h1>
        </div>

        <div class="card">
            <div class="card-header-sm">Your Identity</div>
            
            <label style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 600;">DISPLAY NAME</label>
            <input type="text" id="globalNameInput" class="code-input" placeholder="Enter your display name">
            
            <label style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 600;">CUSTOM STATUS</label>
            <input type="text" id="globalStatusInput" class="code-input" placeholder="e.g. Chilling, Playing BGMI, Editing...">

            <label style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px; display: block; font-weight: 600; margin-top: 4px;">SELECT AVATAR</label>
            <div class="avatar-grid" id="avatarGrid">
                <!-- Standard & Persona-based Avatars -->
                <div class="avatar-btn active" onclick="selectAvatar('👤', this)">👤</div>
                <div class="avatar-btn" onclick="selectAvatar('🎮', this)">🎮</div>
                <div class="avatar-btn" onclick="selectAvatar('⛏️', this)">⛏️</div>
                <div class="avatar-btn" onclick="selectAvatar('📱', this)">📱</div>
                <div class="avatar-btn" onclick="selectAvatar('🎬', this)">🎬</div>
                <div class="avatar-btn" onclick="selectAvatar('🎧', this)">🎧</div>
                <div class="avatar-btn" onclick="selectAvatar('💼', this)">💼</div>
                <div class="avatar-btn" onclick="selectAvatar('🐺', this)">🐺</div>
            </div>

            <button class="btn-purple" onclick="saveGlobalProfile()">
                <i class="fa-solid fa-check"></i> Save Global Profile
            </button>
        </div>

        <div class="card">
            <div class="card-header-sm">App Preferences</div>
            
            <div class="setting-row">
                <div>
                    <div class="setting-label">Adaptive Sync Defaults</div>
                    <div class="setting-desc">Automatically correct slight playback drift.</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="adaptiveSyncToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="setting-row">
                <div>
                    <div class="setting-label">Device Account ID</div>
                    <div class="setting-desc" id="deviceIdDisplay" style="font-family: monospace;">Loading...</div>
                </div>
                <button onclick="resetDeviceId()" style="background:var(--input-bg); border:1px solid var(--card-border); color:var(--text-main); padding:6px 12px; border-radius:8px; font-size:11px; font-weight:bold; cursor:pointer;">Reset</button>
            </div>
        </div>
    </div>

    <div id="toastModal"><i class="fa-solid fa-floppy-disk"></i> Settings Saved!</div>

    <script>
        let currentAvatar = '👤';

        // Load existing settings on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Check for the new global keys, fallback to legacy keys if migrating for the first time
            const savedName = localStorage.getItem('syncbeat_global_name') || localStorage.getItem('syncbeat_device_name') || localStorage.getItem('syncbeat_username') || '';
            const savedStatus = localStorage.getItem('syncbeat_global_status') || 'Ready';
            const savedAvatar = localStorage.getItem('syncbeat_global_avatar') || '👤';
            
            document.getElementById('globalNameInput').value = savedName;
            document.getElementById('globalStatusInput').value = savedStatus;
            
            // Set the correct avatar button active
            const avatarBtns = document.querySelectorAll('.avatar-btn');
            avatarBtns.forEach(btn => {
                if (btn.innerText === savedAvatar) {
                    selectAvatar(savedAvatar, btn);
                }
            });

            // Display Permanent ID
            let permanentId = localStorage.getItem('syncbeat_permanent_device_id');
            if (!permanentId) {
                permanentId = 'SYNC-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                localStorage.setItem('syncbeat_permanent_device_id', permanentId);
            }
            document.getElementById('deviceIdDisplay').textContent = permanentId;
        });

        function selectAvatar(avatar, element) {
            currentAvatar = avatar;
            document.querySelectorAll('.avatar-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function saveGlobalProfile() {
            const name = document.getElementById('globalNameInput').value.trim() || 'User';
            const status = document.getElementById('globalStatusInput').value.trim() || 'Ready';

            // Save to the new unified keys
            localStorage.setItem('syncbeat_global_name', name);
            localStorage.setItem('syncbeat_global_status', status);
            localStorage.setItem('syncbeat_global_avatar', currentAvatar);

            // Package the data
            const profileData = {
                name: name,
                status: status,
                avatar: currentAvatar,
                fullString: `${currentAvatar} ${name} [${status}]`
            };

            // Broadcast to the master hub (index.html)
            window.parent.postMessage({ 
                sender: 'syncbeat_settings', 
                action: 'PROFILE_UPDATED', 
                data: profileData 
            }, '*');

            // Show Toast
            const toast = document.getElementById('toastModal');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function resetDeviceId() {
            if(confirm("Are you sure you want to generate a new Permanent Device ID? You will appear as a new user in rooms.")) {
                const newId = 'SYNC-' + Math.random().toString(36).substring(2, 6).toUpperCase();
                localStorage.setItem('syncbeat_permanent_device_id', newId);
                document.getElementById('deviceIdDisplay').textContent = newId;
            }
        }
    </script>
</body>
</html>
