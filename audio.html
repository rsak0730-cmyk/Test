<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncBeat - Advanced Audio Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { themeBg: 'rgb(var(--color-bg-base) / <alpha-value>)', themeCard: 'rgb(var(--color-bg-card) / <alpha-value>)', themeAccent: 'rgb(var(--color-accent) / <alpha-value>)', themeText: 'rgb(var(--color-text-main) / <alpha-value>)', themeMuted: 'rgb(var(--color-text-muted) / <alpha-value>)', themeBorder: 'rgb(var(--color-border) / <alpha-value>)', themeBtnText: 'rgb(var(--color-btn-text) / <alpha-value>)' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --color-accent: 251 191 36; --color-bg-base: 23 20 15; --color-bg-card: 36 31 22; --color-text-main: 254 243 199; --color-text-muted: 202 138 4; --color-border: 113 63 18; --color-shadow: 251 191 36; --color-btn-text: 69 26 3; }
        * { box-sizing: border-box; }
        html, body {
            width: 100vw; min-height: 100vh; margin: 0; padding: 0;
            transition: background-color 0.8s ease, color 0.8s ease; overscroll-behavior-y: none; padding-bottom: 95px !important;
            display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
        }
        header, main { width: 100%; max-width: 480px; margin: 0 auto; }
        .soundboard-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
        .sound-btn { background: rgba(0,0,0,0.3); border: 1px solid rgb(var(--color-border)); padding: 8px; border-radius: 10px; font-size: 16px; text-align: center; cursor: pointer; }
    </style>
</head>
<body class="bg-themeBg text-themeText min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

    <header class="bg-themeCard border-b border-themeBorder/50 px-4 py-3 flex items-center justify-between shadow-lg sticky top-0 z-40">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="location.reload()">
            <div class="w-10 h-10 rounded-xl bg-themeAccent flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-compact-disc text-themeBtnText animate-spin"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wider text-themeAccent">SyncBeat Audio</h1>
                <p class="text-xs text-themeText opacity-60">P2P Music Sync</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <select id="userStatusSelect" onchange="updateStatus(this.value)" class="bg-black/40 border border-themeBorder text-xs rounded-lg px-2 py-1.5 text-themeText focus:outline-none">
                <option value="Online">🟢 Online</option>
                <option value="AFK">🌙 AFK</option>
                <option value="VIP">👑 VIP</option>
            </select>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 w-full">
        <div id="homeView" class="w-full bg-themeCard border border-themeBorder/50 rounded-2xl p-6 space-y-6 shadow-xl">
            <div class="text-center space-y-2"><h2 class="text-2xl font-bold text-themeAccent">Synchronized Audio</h2><p class="text-sm text-themeText opacity-80">Search songs by name & listen together glitch-free.</p></div>
            <div class="space-y-4">
                <div><label class="block text-xs font-semibold text-themeMuted uppercase tracking-wider mb-1">Your Name</label><input type="text" id="userNameInput" placeholder="Display name" class="w-full bg-black/20 border border-themeBorder/60 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-themeAccent"></div>
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button onclick="createRoom()" class="w-full bg-themeAccent text-themeBtnText font-bold py-3 px-4 rounded-xl transition flex items-center justify-center space-x-2"><i class="fa-solid fa-plus"></i><span>Host Room</span></button>
                    <button onclick="showJoinModal()" class="w-full bg-black/40 text-themeAccent font-bold py-3 px-4 rounded-xl border border-themeBorder transition flex items-center justify-center space-x-2"><i class="fa-solid fa-right-to-bracket"></i><span>Join Room</span></button>
                </div>
            </div>
        </div>

        <div id="roomView" class="w-full hidden flex-col gap-6">
            <div class="w-full flex flex-col space-y-4">
                <div class="bg-themeCard border border-themeBorder/50 rounded-xl p-4 flex flex-wrap items-center justify-between gap-3">
                    <span class="bg-black/30 text-themeAccent border border-themeBorder/70 text-xs font-mono px-3 py-1.5 rounded-lg">Room: <span id="displayRoomCode" class="font-bold">----</span></span>
                    <button onclick="leaveRoom()" class="bg-red-900/40 text-red-400 border border-red-700/50 text-xs font-semibold px-3 py-2 rounded-lg">Leave Room</button>
                </div>

                <div id="hostControlsWrapper" class="relative w-full hidden z-20">
                    <div class="bg-themeCard border border-themeBorder/50 rounded-xl p-4 flex items-center space-x-3">
                        <input type="text" id="mediaUrlInput" onkeydown="if(event.key==='Enter') searchMedia()" placeholder="Search song by name..." class="flex-1 bg-black/20 border border-themeBorder/60 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-themeAccent">
                        <button id="searchBtn" onclick="searchMedia()" class="bg-themeAccent text-themeBtnText text-sm font-bold px-5 py-2.5 rounded-lg w-28">Search</button>
                    </div>
                </div>

                <div class="relative w-full bg-themeBg/90 rounded-2xl border border-themeBorder/60 shadow-2xl p-6 flex flex-col items-center justify-center overflow-hidden min-h-[300px]">
                    <div id="youtubePlayer" class="absolute w-1 h-1 opacity-0 pointer-events-none -z-50"></div>
                    
                    <div id="playerPlaceholder" class="flex flex-col items-center justify-center text-themeMuted space-y-4 py-10">
                        <i class="fa-solid fa-music text-5xl animate-bounce"></i>
                        <p class="text-sm font-medium">Search a track above to start audio streaming.</p>
                    </div>

                    <div id="musicPlayerUI" class="hidden w-full max-w-sm flex flex-col items-center relative z-10 py-2">
                        <div class="w-48 h-48 rounded-xl shadow-2xl mb-6 overflow-hidden border-2 border-themeBorder">
                            <img id="uiThumbnail" src="" class="w-full h-full object-cover" alt="Cover Art">
                        </div>
                        <div class="text-center w-full px-4 mb-5">
                            <h2 id="uiTitle" class="text-lg font-bold text-themeAccent truncate">Song Title</h2>
                            <p id="uiArtist" class="text-xs text-themeMuted truncate mt-1">Artist Name</p>
                        </div>
                        <div class="w-full flex items-center space-x-3 mb-6 px-2">
                            <span id="currentTimeDisplay" class="text-xs text-themeText font-mono">0:00</span>
                            <input type="range" id="timelineSlider" value="0" min="0" max="100" step="0.1" class="flex-1 h-2 bg-black/40 rounded-full appearance-none cursor-pointer">
                            <span id="durationDisplay" class="text-xs text-themeText font-mono">0:00</span>
                        </div>
                        <div id="hostPlaybackControls" class="hidden flex items-center space-x-4">
                            <button onclick="togglePlayPause()" id="playPauseBtn" class="w-16 h-16 rounded-full bg-themeAccent text-themeBtnText flex items-center justify-center shadow-lg"><i class="fa-solid fa-pause text-2xl"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Interactive Soundboard -->
                <div class="bg-themeCard border border-themeBorder/50 rounded-xl p-4">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-themeMuted mb-2">Soundboard</h3>
                    <div class="soundboard-grid">
                        <div class="sound-btn" onclick="playSound('rimshot')">🥁</div>
                        <div class="sound-btn" onclick="playSound('airhorn')">📯</div>
                        <div class="sound-btn" onclick="playSound('cricket')">🦗</div>
                        <div class="sound-btn" onclick="playSound('gasp')">😱</div>
                    </div>
                </div>

                <div class="bg-themeCard border border-themeBorder/50 rounded-xl p-4 flex flex-col min-h-[15rem]">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-themeMuted mb-3 flex items-center justify-between">
                        <span>Participants</span><span id="peerCount" class="bg-black/30 text-themeAccent px-2 py-0.5 rounded-full text-xs">0</span>
                    </h3>
                    <div id="peerList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="joinModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-themeCard border border-themeBorder rounded-2xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-themeAccent">Join Room</h3>
            <input type="text" id="joinRoomCodeInput" placeholder="ROOM CODE" class="w-full bg-black/30 border border-themeBorder rounded-xl px-4 py-3 text-white uppercase text-center font-mono focus:outline-none">
            <div class="flex space-x-2 pt-2">
                <button onclick="closeJoinModal()" class="flex-1 bg-black/40 text-themeAccent py-3 rounded-xl text-sm font-bold border border-themeBorder">Cancel</button>
                <button onclick="joinRoom()" class="flex-1 bg-themeAccent text-themeBtnText py-3 rounded-xl text-sm font-bold">Join</button>
            </div>
        </div>
    </div>

    <audio id="sfx-rimshot" src="https://www.myinstants.com/media/sounds/rimshot.mp3"></audio>
    <audio id="sfx-airhorn" src="https://www.myinstants.com/media/sounds/mlg-airhorn.mp3"></audio>
    <audio id="sfx-cricket" src="https://www.myinstants.com/media/sounds/crickets.mp3"></audio>
    <audio id="sfx-gasp" src="https://www.myinstants.com/media/sounds/gasp.mp3"></audio>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        function notifyParent(action, code='') { window.parent.postMessage({ sender: 'syncbeat', tab: 2, action, code }, '*'); }
        let ws = null; let wsUrl = 'wss://syncbeat-backend2.onrender.com';
        let currentRoomCode = null; let isHost = false; let inRoom = false; let ytPlayer = null; let ytApiReady = false; 
        let currentUserName = localStorage.getItem('syncbeat_name') || 'User';

        document.getElementById('userNameInput').value = currentUserName;

        function updateStatus(status) {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'UPDATE_STATUS', name: currentUserName, status: status }));
        }

        function connectWebSocket() {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                if (inRoom && currentRoomCode) ws.send(JSON.stringify({ type: isHost ? 'HOST_ROOM' : 'JOIN_ROOM', code: currentRoomCode, name: currentUserName }));
            };
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'ROOM_CREATED' || msg.type === 'ROOM_HOSTED_SUCCESS') { currentRoomCode = msg.code; isHost = true; onRoomJoined(); }
                else if (msg.type === 'ROOM_JOINED' || msg.type === 'ROOM_JOIN_SUCCESS') { currentRoomCode = msg.code; isHost = false; onRoomJoined(); }
                else if (msg.type === 'PEER_LIST') { updatePeerList(msg.peers); }
                else if (msg.type === 'PLAY_YOUTUBE' || msg.type === 'LOAD_VIDEO') { if (!isHost) loadAndPlayYouTube(msg.ytId, msg.time || 0, msg); }
                else if (msg.type === 'PLAY_SOUND') { document.getElementById(`sfx-${msg.sound}`).play().catch(e => {}); }
            };
        }
        connectWebSocket();

        function createRoom() {
            currentUserName = document.getElementById('userNameInput').value || 'User';
            ws.send(JSON.stringify({ type: 'CREATE_ROOM', code: Math.random().toString(36).substring(2, 8).toUpperCase(), name: currentUserName }));
        }

        function showJoinModal() { document.getElementById('joinModal').classList.remove('hidden'); }
        function closeJoinModal() { document.getElementById('joinModal').classList.add('hidden'); }
        function joinRoom() {
            currentUserName = document.getElementById('userNameInput').value || 'User';
            const code = document.getElementById('joinRoomCodeInput').value.trim().toUpperCase();
            if(code) ws.send(JSON.stringify({ type: 'JOIN_ROOM', code: code, name: currentUserName }));
            closeJoinModal();
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtubePlayer', { height: '100%', width: '100%', playerVars: { 'autoplay': 1, 'controls': 0, 'rel': 0 }, events: { 'onReady': () => { ytApiReady = true; } } });
        }

        function onRoomJoined() {
            inRoom = true;
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('roomView').classList.remove('hidden');
            document.getElementById('roomView').classList.add('flex');
            document.getElementById('displayRoomCode').textContent = currentRoomCode;
            if (isHost) {
                document.getElementById('hostControlsWrapper').classList.remove('hidden');
                document.getElementById('hostPlaybackControls').classList.remove('hidden');
            }
            notifyParent('ROOM_OPENED', currentRoomCode);
        }

        function leaveRoom() {
            inRoom = false; currentRoomCode = null; isHost = false;
            document.getElementById('roomView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
            if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
            notifyParent('ROOM_CLOSED');
        }

        async function searchMedia() {
            const query = document.getElementById('mediaUrlInput').value.trim();
            if (!query) return;
            playSelectedVideo({ videoId: 'dQw4w9WgXcQ', title: query, uploaderName: 'YouTube Stream', thumbUrl: 'https://i.ytimg.com/vi/dQw4w9WgXcQ/hqdefault.jpg' });
        }

        function playSelectedVideo(videoData) {
            ws.send(JSON.stringify({ type: 'PLAY_YOUTUBE', ytId: videoData.videoId, title: videoData.title, artist: videoData.uploaderName, thumb: videoData.thumbUrl, time: 0 }));
            loadAndPlayYouTube(videoData.videoId, 0, videoData);
        }

        function loadAndPlayYouTube(ytId, startTime = 0, meta = null) {
            document.getElementById('playerPlaceholder').classList.add('hidden');
            document.getElementById('musicPlayerUI').classList.remove('hidden');
            if(meta) { document.getElementById('uiTitle').textContent = meta.title; document.getElementById('uiArtist').textContent = meta.artist; document.getElementById('uiThumbnail').src = meta.thumb; }
            if(ytApiReady && ytPlayer) ytPlayer.loadVideoById({videoId: ytId, startSeconds: startTime});
        }

        function togglePlayPause() {
            if(!ytPlayer) return;
            if(ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
            else ytPlayer.playVideo();
        }

        function playSound(soundId) {
            document.getElementById(`sfx-${soundId}`).play().catch(e => {});
            if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'PLAY_SOUND', sound: soundId }));
        }

        function updatePeerList(peers) {
            document.getElementById('peerCount').textContent = peers.length;
            const listContainer = document.getElementById('peerList');
            listContainer.innerHTML = '';
            peers.forEach(peer => {
                listContainer.innerHTML += `<div class="flex items-center justify-between bg-black/20 border border-themeBorder/40 px-3 py-2 rounded-lg text-xs"><span>👤 ${peer.name} (${peer.status || 'Online'})</span><span class="font-bold">${peer.role}</span></div>`;
            });
        }
    </script>
</body>
</html>
