<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncBeat - Master Golden Room</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        /* --- 1. VIRTUAL ROOM THEMES --- */
        :root {
            --bg-start: #1c1404; --bg-end: #080602;
            --card-bg: rgba(30, 24, 10, 0.65);
            --accent: #fbbf24; --accent-alt: #d97706;
            --text: #fef3c7; --border: rgba(251, 191, 36, 0.25);
        }
        [data-theme="cyberpunk"] {
            --bg-start: #0a0a1a; --bg-end: #020205;
            --card-bg: rgba(20, 10, 40, 0.75);
            --accent: #00ffcc; --accent-alt: #ff00ff;
            --text: #e0e0ff; --border: rgba(0, 255, 204, 0.4);
        }
        [data-theme="cinema"] {
            --bg-start: #111; --bg-end: #000;
            --card-bg: rgba(20, 20, 20, 0.9);
            --accent: #e50914; --accent-alt: #b20710;
            --text: #fff; --border: rgba(229, 9, 20, 0.3);
        }

        body { 
            font-family: -apple-system, sans-serif; 
            background: radial-gradient(circle at 50% 0%, var(--bg-start) 0%, var(--bg-end) 100%); 
            color: var(--text); margin: 0; padding: 15px; padding-bottom: 95px !important; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
            transition: all 0.5s ease; 
        }
        .container { width: 100%; max-width: 450px; position: relative; z-index: 2; }
        .card { 
            background: var(--card-bg); backdrop-filter: blur(16px); 
            border: 1px solid var(--border); border-radius: 20px; 
            padding: 16px; margin-bottom: 14px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.4); 
            transition: all 0.3s ease; 
        }
        
        button { cursor: pointer; transition: all 0.2s ease; outline: none; border: none; }
        button:active { transform: scale(0.95); }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 900; color: var(--accent); }
        
        .input-base { 
            width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border); 
            color: var(--text); padding: 12px; border-radius: 12px; font-size: 14px; 
            box-sizing: border-box; margin-bottom: 8px; 
        }
        
        .btn-main { 
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-alt) 100%); 
            color: #000; width: 100%; padding: 14px; border-radius: 14px; 
            font-size: 14px; font-weight: 800; margin-bottom: 8px; 
        }
        
        .flex-row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
        
        /* --- 2. MOOD RING & ACHIEVEMENTS --- */
        @keyframes heartbeat {
            0%, 100% { box-shadow: 0 0 5px var(--accent); }
            50% { box-shadow: 0 0 20px #ff0055, 0 0 30px #ff0055; }
        }
        .mood-ring-active { animation: heartbeat 1s infinite; border-radius: 50%; }
        
        .badge { 
            background: rgba(255,255,255,0.1); border: 1px solid var(--border); 
            padding: 2px 6px; border-radius: 8px; font-size: 9px; margin-left: 4px; color: var(--accent);
        }

        /* --- 3. QR & UI ELEMENTS --- */
        .qr-container { background: #fff; padding: 10px; border-radius: 12px; margin-top: 10px; display: none; text-align: center; }
        .qr-container img { width: 140px; height: 140px; margin: 0 auto; }
        
        .soundboard-grid, .avatar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .mini-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        .mini-btn.active { background: var(--accent); color: #000; }

        .overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; display: none; text-align: center; padding: 20px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- OVERLAYS (Sleep Timer & Scheduling) -->
    <div id="sleepOverlay" class="overlay">
        <h2 style="color: var(--accent);">💤 Room is Asleep</h2>
        <p style="color: #aaa;">Audio muted and video paused.</p>
        <button class="btn-main" style="width: 200px; margin-top: 20px;" onclick="wakeUpRoom()">Wake Up</button>
    </div>

    <div class="container">
        
        <!-- ================= LANDING VIEW ================= -->
        <div id="mainLandingView">
            <div class="header">
                <h1>SyncBeat ✨</h1>
                <select id="themeSelector" onchange="changeTheme(this.value)" style="background: rgba(0,0,0,0.5); color: var(--accent); border: 1px solid var(--border); padding: 5px; border-radius: 8px;">
                    <option value="golden">Golden Theme</option>
                    <option value="cyberpunk">Cyberpunk</option>
                    <option value="cinema">Cinema Dark</option>
                </select>
            </div>

            <div class="card">
                <div style="font-size: 11px; color: var(--accent); margin-bottom: 5px; font-weight: bold;">AVATAR & PROFILE</div>
                <input type="text" id="userNameInput" class="input-base" placeholder="Display Name">
                <input type="text" id="userStatusInput" class="input-base" placeholder="Status (e.g. VIP, AFK)">
                
                <div style="font-size: 10px; color: #888; margin-top: 5px;">Select Avatar:</div>
                <div class="avatar-grid">
                    <button class="mini-btn avatar-btn active" onclick="selectAvatar('🐺')">🐺 Wolf</button>
                    <button class="mini-btn avatar-btn" onclick="selectAvatar('🦉')">🦉 Owl</button>
                    <button class="mini-btn avatar-btn" onclick="selectAvatar('🐉')">🐉 Dragon</button>
                </div>
            </div>

            <div class="card">
                <button class="btn-main" onclick="startHostingSession()">👑 Host New Room</button>
                <button class="btn-main" style="background: transparent; border: 1px solid var(--accent); color: var(--accent);" onclick="generateInvite()">📅 Schedule Party</button>
                <div style="margin: 15px 0; border-top: 1px solid var(--border);"></div>
                <input type="text" id="roomCodeInput" class="input-base" placeholder="Enter Room Code">
                <button class="btn-main" style="background: #333; color: #fff;" onclick="connectToRoom()">Join Room</button>
            </div>
        </div>

        <!-- ================= HOST / ROOM VIEW ================= -->
        <div id="hostSessionView" class="hidden">
            <div class="header">
                <button onclick="leaveRoom()" style="background: none; color: var(--accent); font-size: 20px; padding: 0;">←</button>
                <div style="text-align: right;">
                    <div id="roleIndicator" style="font-weight: bold; color: var(--accent);">Room</div>
                    <div id="timezoneDisplay" style="font-size: 10px; color: #888;">Detecting Timezone...</div>
                </div>
            </div>

            <!-- Global Tools: QR & Bluetooth -->
            <div class="card flex-row" style="flex-wrap: wrap;">
                <div style="font-size: 22px; font-weight: 900; letter-spacing: 2px;" id="displayRoomCode">SYNC-0000</div>
                <div style="display: flex; gap: 5px;">
                    <button class="mini-btn" onclick="toggleQR()">📱 QR Join</button>
                    <button class="mini-btn" id="btHeartBtn" onclick="connectHeartRate()">❤️ Connect HR</button>
                </div>
                <div id="qrBox" class="qr-container" style="width: 100%;">
                    <img id="qrImage" src="" alt="Room QR">
                </div>
            </div>

            <!-- Player & Controls -->
            <div class="card" id="hostUrlControls">
                <div class="flex-row">
                    <input type="text" id="videoUrlInput" class="input-base" style="margin: 0;" placeholder="Paste YouTube ID...">
                    <!-- P2P Offline Video Trigger -->
                    <button class="mini-btn" style="padding: 12px; height: 100%;" onclick="document.getElementById('p2pFile').click()">📂 P2P</button>
                    <input type="file" id="p2pFile" accept="video/*" class="hidden" onchange="loadLocalP2P(this)">
                </div>

                <div id="ytEmbedWrapper" style="width: 100%; height: 200px; background: #000; border-radius: 12px; overflow: hidden; margin: 10px 0;">
                    <div id="ytPlayerDiv"></div>
                </div>
                
                <div class="flex-row" style="margin-bottom: 10px;">
                    <button class="btn-main" id="playBtn" style="margin: 0;" onclick="togglePlayPause()">▶ Play/Pause</button>
                </div>

                <!-- Adaptive Sync & Volume -->
                <div class="flex-row" style="margin-bottom: 10px;">
                    <div style="width: 50%;">
                        <div style="font-size: 10px; color: var(--accent);">VOLUME SYNC</div>
                        <input type="range" id="masterVolume" min="0" max="100" value="100" style="width: 100%;" onchange="syncVolume(this.value)">
                    </div>
                    <div style="width: 50%; text-align: right;">
                        <div style="font-size: 10px; color: var(--accent);">ADAPTIVE SYNC</div>
                        <button id="adaptiveBtn" class="mini-btn" style="width: 100%; margin-top: 2px;" onclick="toggleAdaptive()">🟢 Enabled</button>
                    </div>
                </div>
                
                <!-- Sleep Timer -->
                <div class="flex-row">
                    <select id="sleepTimerSelect" class="input-base" style="width: 60%; margin: 0;">
                        <option value="0">Sleep Timer: Off</option>
                        <option value="15">15 Minutes</option>
                        <option value="45">45 Minutes</option>
                    </select>
                    <button class="btn-main" style="width: 35%; margin: 0; padding: 12px;" onclick="startSleepTimer()">Set</button>
                </div>
            </div>

            <!-- Soundboard -->
            <div class="card">
                <div style="font-size: 11px; color: var(--accent); margin-bottom: 5px;">INTERACTIVE SOUNDBOARD</div>
                <div class="soundboard-grid">
                    <button class="mini-btn" onclick="sendSound('airhorn')">🎺 Airhorn</button>
                    <button class="mini-btn" onclick="sendSound('cricket')">🦗 Cricket</button>
                    <button class="mini-btn" onclick="sendSound('wow')">😲 Wow</button>
                </div>
            </div>

            <!-- Peer List & Achievements -->
            <div class="card">
                <div style="font-size: 11px; color: var(--accent); margin-bottom: 5px;">ROOM PARTICIPANTS (<span id="peerCount">1</span>)</div>
                <div id="peerListContainer"></div>
            </div>
        </div>
    </div>

    <!-- Hidden Audio Sources -->
    <audio id="sfx_airhorn" src="https://www.myinstants.com/media/sounds/mlg-airhorn.mp3"></audio>
    <audio id="sfx_cricket" src="https://www.myinstants.com/media/sounds/crickets.mp3"></audio>
    <audio id="sfx_wow" src="https://www.myinstants.com/media/sounds/anime-wow-sound-effect.mp3"></audio>
    <script>
        // --- CORE VARIABLES ---
        const WS_URL = 'wss://syncbeat-backend2.onrender.com';
        let ws = null;
        let isHosting = false;
        let currentRoomCode = '';
        let currentUserName = localStorage.getItem('syncbeat_username') || 'User';
        let currentAvatar = '🐺';
        let currentAccountId = localStorage.getItem('syncbeat_acc_id') || ('DEV-' + Math.random().toString(36).substring(2, 7).toUpperCase());
        localStorage.setItem('syncbeat_acc_id', currentAccountId);
        
        let ytPlayer = null;
        let ytReady = false;
        let sleepTimerId = null;
        let adaptiveSyncEnabled = true;
        
        // --- 1. VIRTUAL ROOM THEMES & AVATARS ---
        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
        }

        function selectAvatar(avatar) {
            currentAvatar = avatar;
            document.querySelectorAll('.avatar-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // --- 2. GLOBAL TIMEZONE COORDINATOR ---
        function detectTimezone() {
            try {
                const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
                document.getElementById('timezoneDisplay').textContent = `Local TZ: ${tz}`;
            } catch (e) {
                document.getElementById('timezoneDisplay').textContent = "TZ: Auto";
            }
        }
        detectTimezone();

        // --- 3. AUTOMATED ROOM SCHEDULING ---
        function generateInvite() {
            const code = 'SYNC-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            const text = `Join my SyncBeat Watch Party! Room: ${code}. Tap to join when it's time!`;
            if (navigator.share) {
                navigator.share({ title: 'SyncBeat Watch Party', text: text }).catch(e => console.log(e));
            } else {
                alert(`Invite generated for Room: ${code}\nCopy this code and send it to your friends!`);
            }
        }

        // --- 4. CROSS-PLATFORM QR CODE QUICK JOIN ---
        function toggleQR() {
            const qrBox = document.getElementById('qrBox');
            if (qrBox.style.display === 'block') {
                qrBox.style.display = 'none';
            } else {
                qrBox.style.display = 'block';
                // Utilizing a fast, public QR code generation API
                document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${currentRoomCode}`;
            }
        }

        // --- 5. WATCH PARTY MOOD RING (WEB BLUETOOTH WRAPPER) ---
        async function connectHeartRate() {
            try {
                // Standard experimental Web Bluetooth API call for Heart Rate service
                const device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
                const server = await device.gatt.connect();
                document.getElementById('btHeartBtn').textContent = '❤️ Connected';
                document.getElementById('btHeartBtn').classList.add('active');
                
                // Broadcast connection to room so avatar can pulse
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'MOOD_RING', active: true, accountId: currentAccountId }));
                }
                alert("Heart rate monitor connected! Your avatar will pulse a glowing red hue during intense scenes.");
            } catch (err) {
                console.log("Bluetooth connect failed or cancelled.", err);
                alert("Bluetooth device not found or permissions denied. Ensure your browser supports Web Bluetooth flags.");
            }
        }

        // --- 6. SMART SLEEP TIMER & AUTO-SHUTDOWN ---
        function startSleepTimer() {
            const mins = parseInt(document.getElementById('sleepTimerSelect').value);
            clearTimeout(sleepTimerId);
            if (mins > 0) {
                alert(`Smart Sleep Timer activated: Muting and locking screen in ${mins} minutes.`);
                sleepTimerId = setTimeout(() => {
                    if (ytReady && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
                    document.getElementById('sleepOverlay').style.display = 'flex';
                }, mins * 60000); // Convert minutes to milliseconds
            } else {
                alert("Sleep timer disabled.");
            }
        }

        function wakeUpRoom() {
            document.getElementById('sleepOverlay').style.display = 'none';
        }

        // --- 7. SMART BANDWIDTH ADAPTIVE SYNC (FRONTEND TOGGLE) ---
        function toggleAdaptive() {
            adaptiveSyncEnabled = !adaptiveSyncEnabled;
            const btn = document.getElementById('adaptiveBtn');
            btn.textContent = adaptiveSyncEnabled ? '🟢 Enabled' : '🔴 Disabled';
            btn.classList.toggle('active', adaptiveSyncEnabled);
        }

        // --- 8. OFFLINE LOCAL FILE P2P (WRAPPER) ---
        function loadLocalP2P(input) {
            const file = input.files[0];
            if (!file) return;
            alert(`P2P Stream initialized for: ${file.name}.\n\n(Note: Requires WebRTC upgrade in your server.js backend to open DataChannels to peers).`);
        }

        // --- 9. YOUTUBE API & MEDIA CONTROLS ---
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('ytPlayerDiv', {
                height: '100%', width: '100%', videoId: '',
                playerVars: { 'autoplay': 1, 'controls': 1, 'disablekb': 1, 'playsinline': 1 },
                events: { 'onStateChange': onPlayerStateChange }
            });
            ytReady = true;
        }

        function onPlayerStateChange(event) {
            if (!isHosting) return;
            if (event.data === YT.PlayerState.PLAYING && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'CONTROL', action: 'play', time: ytPlayer.getCurrentTime() }));
            } else if (event.data === YT.PlayerState.PAUSED && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'CONTROL', action: 'pause', time: ytPlayer.getCurrentTime() }));
            }
        }

        function togglePlayPause() {
            if (!isHosting || !ytPlayer || typeof ytPlayer.getPlayerState !== 'function') return;
            
            const inputId = document.getElementById('videoUrlInput').value.trim();
            // If the host pasted a new ID, load it first
            if (inputId && (ytPlayer.getPlayerState() === YT.PlayerState.CUED || ytPlayer.getPlayerState() === -1)) {
                 ytPlayer.loadVideoById({ videoId: inputId });
                 if (ws) ws.send(JSON.stringify({ type: 'PLAY_YOUTUBE', ytId: inputId, currentTime: 0 }));
                 document.getElementById('videoUrlInput').value = ''; 
            } else {
                if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
                else ytPlayer.playVideo();
            }
        }

        // --- 10. REAL-TIME SYNCHRONIZED VOLUME CONTROL ---
        function syncVolume(level) {
            if (!isHosting || !ytReady) return;
            ytPlayer.setVolume(level);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'VOLUME', level: level }));
            }
        }

        // --- 11. INTERACTIVE SOUNDBOARD EFFECTS ---
        function sendSound(soundId) {
            playSound(soundId);
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'SOUNDBOARD', sound: soundId }));
            }
        }

        function playSound(soundId) {
            const audio = document.getElementById(`sfx_${soundId}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio blocked by browser auto-play rules. User interaction required."));
            }
        }

        // --- 12. WEBSOCKETS, ROOM SETUP & ACHIEVEMENTS ---
        function connectWebSocket(callback) {
            if (ws && ws.readyState === WebSocket.OPEN) { if (callback) callback(); return; }
            ws = new WebSocket(WS_URL);
            ws.onopen = () => { if (callback) callback(); };
            ws.onmessage = (event) => {
                try { handleServerMessage(JSON.parse(event.data)); } catch(e) {}
            };
        }

        function handleServerMessage(data) {
            if (data.type === 'ROOM_CREATED' || data.type === 'ROOM_HOSTED_SUCCESS') {
                isHosting = true;
                setupRoomUI('HOST', currentRoomCode);
            } else if (data.type === 'ROOM_JOINED' || data.type === 'ROOM_JOIN_SUCCESS') {
                isHosting = false;
                setupRoomUI('MEMBER', data.code);
            } else if (data.type === 'PLAY_YOUTUBE' && !isHosting && ytReady) {
                ytPlayer.loadVideoById({ videoId: data.ytId, startSeconds: data.currentTime || 0 });
            } else if (data.type === 'CONTROL' && !isHosting && ytReady) {
                // Adaptive Sync Hook: Smooth out jumps if enabled
                const drift = Math.abs(ytPlayer.getCurrentTime() - data.time);
                if (adaptiveSyncEnabled && drift < 0.8) {
                    // Do nothing, let it naturally catch up
                } else {
                    if (data.action === 'play') { ytPlayer.seekTo(data.time, true); ytPlayer.playVideo(); }
                    if (data.action === 'pause') { ytPlayer.seekTo(data.time, true); ytPlayer.pauseVideo(); }
                }
            } else if (data.type === 'VOLUME' && !isHosting && ytReady) {
                ytPlayer.setVolume(data.level);
            } else if (data.type === 'SOUNDBOARD') {
                playSound(data.sound);
            } else if (data.type === 'MOOD_RING') {
                // Trigger visual heartrate heartbeat on peer's UI container
                const peerEl = document.getElementById(`peer_${data.accountId}`);
                if (peerEl) {
                    peerEl.classList.add('mood-ring-active');
                    setTimeout(() => peerEl.classList.remove('mood-ring-active'), 4000);
                }
            } else if (data.type === 'PEER_LIST') {
                renderPeers(data.peers || []);
            }
        }

        function startHostingSession() {
            currentUserName = document.getElementById('userNameInput').value.trim() || 'User';
            localStorage.setItem('syncbeat_username', currentUserName);
            const status = document.getElementById('userStatusInput').value.trim() || 'Host';
            currentRoomCode = 'SYNC-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            
            connectWebSocket(() => {
                // Pack Avatar and Status directly into the name for backend backward-compatibility
                const fullProfileData = `${currentAvatar} ${currentUserName} [${status}]`;
                ws.send(JSON.stringify({ type: 'HOST_ROOM', code: currentRoomCode, name: fullProfileData, accountId: currentAccountId }));
                ws.send(JSON.stringify({ type: 'CREATE_ROOM', code: currentRoomCode, name: fullProfileData, accountId: currentAccountId }));
            });
        }

        function connectToRoom() {
            currentUserName = document.getElementById('userNameInput').value.trim() || 'User';
            localStorage.setItem('syncbeat_username', currentUserName);
            const status = document.getElementById('userStatusInput').value.trim() || 'Member';
            currentRoomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            
            if(!currentRoomCode) { alert("Enter a room code."); return; }

            connectWebSocket(() => {
                const fullProfileData = `${currentAvatar} ${currentUserName} [${status}]`;
                ws.send(JSON.stringify({ type: 'JOIN_ROOM', code: currentRoomCode, name: fullProfileData, accountId: currentAccountId }));
            });
        }

        function leaveRoom() {
            if (ws) { ws.close(); ws = null; }
            if (ytPlayer && typeof ytPlayer.stopVideo === 'function') ytPlayer.stopVideo();
            document.getElementById('hostSessionView').classList.add('hidden');
            document.getElementById('mainLandingView').classList.remove('hidden');
            clearTimeout(sleepTimerId);
            document.getElementById('qrBox').style.display = 'none';
        }

        function setupRoomUI(role, code) {
            document.getElementById('mainLandingView').classList.add('hidden');
            document.getElementById('hostSessionView').classList.remove('hidden');
            document.getElementById('displayRoomCode').textContent = code;
            document.getElementById('roleIndicator').textContent = role === 'HOST' ? '👑 Hosting Room' : '🎧 Member View';
            
            const isHost = role === 'HOST';
            document.getElementById('videoUrlInput').style.display = isHost ? 'block' : 'none';
            document.getElementById('masterVolume').parentElement.style.display = isHost ? 'block' : 'none';
            document.getElementById('playBtn').style.display = isHost ? 'block' : 'none';
            document.getElementById('p2pFile').previousElementSibling.style.display = isHost ? 'block' : 'none';
        }

        // --- WATCH PARTY ACHIEVEMENT BADGES ---
        function renderPeers(peers) {
            const container = document.getElementById('peerListContainer');
            document.getElementById('peerCount').textContent = peers.length;
            container.innerHTML = '';
            
            const hour = new Date().getHours();
            
            peers.forEach(peer => {
                let badgeHTML = '';
                // Dynamic Badges based on local time and role
                if (peer.role === 'HOST') badgeHTML += '<span class="badge">Master Host 🏆</span>';
                if (hour >= 2 && hour < 6) badgeHTML += '<span class="badge">Night Owl 🦉</span>';

                // Use the account ID for the DOM element to allow the Mood Ring to target it
                const domId = peer.accountId || Math.random().toString(36).substring(2,7);

                container.innerHTML += `
                <div id="peer_${domId}" style="padding: 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; transition: box-shadow 0.3s;">
                    <div>
                        <span style="font-weight: bold; font-size: 14px;">${peer.name}</span>
                        ${badgeHTML}
                    </div>
                    <span style="font-size: 10px; color: var(--accent-alt);">${peer.role}</span>
                </div>`;
            });
        }
    </script>
</body>
</html>
