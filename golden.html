<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncBeat - Golden Room (Advanced)</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100vw; min-height: 100vh; margin: 0; padding: 15px; padding-bottom: 95px !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1c1404 0%, #080602 100%); color: #fef3c7;
            display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
        }
        .container { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; }
        .card { width: 100%; background: linear-gradient(135deg, rgba(30, 24, 10, 0.65) 0%, rgba(15, 12, 4, 0.8) 100%); backdrop-filter: blur(16px); border: 1px solid rgba(251, 191, 36, 0.25); border-radius: 24px; padding: 18px; margin-bottom: 16px; box-shadow: 0 8px 32px 0 rgba(251, 191, 36, 0.45); }
        button, .code-action-btn, .btn-purple { cursor: pointer; border: 1px solid rgba(251, 191, 36, 0.3); outline: none; transition: all 0.2s; }
        .code-input, .search-input { width: 100%; background: rgba(10, 8, 2, 0.7); border: 1px solid rgba(251, 191, 36, 0.3); color: #fef3c7; padding: 14px; border-radius: 14px; font-size: 14px; outline: none; }
        .btn-purple { background: linear-gradient(135deg, #fbbf24 0%, #d97706 50%, #b45309 100%); color: #1c1404; width: 100%; padding: 16px; border-radius: 16px; font-size: 15px; font-weight: 800; border: 1px solid rgba(255, 255, 255, 0.4); }
        .badge-warning { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); font-size: 10px; padding: 4px 8px; border-radius: 6px; }
        .hidden { display: none !important; }
        #mainLandingView, #hostSessionView { width: 100%; display: flex; flex-direction: column; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card" id="timezoneCard">
            <div style="font-weight: 900; font-size: 14px; color: #fbbf24; margin-bottom: 8px;">🌍 Global Timezone Coordinator</div>
            <p style="font-size: 11px; color: rgba(254, 243, 199, 0.7); margin-bottom: 10px;">Detected Local Timezone: <span id="detectedTz" style="color: #fff; font-weight: bold;"></span></p>
            <div style="display: flex; gap: 8px; margin-bottom: 8px; width: 100%;">
                <input type="datetime-local" id="targetWatchTime" class="code-input" style="padding: 10px; font-size: 12px;">
                <button class="code-action-btn" style="background: #fbbf24; color: #1c1404; font-weight: bold; border-radius: 10px; padding: 0 12px;" onclick="broadcastTimezoneSchedule()">Sync</button>
            </div>
            <div id="scheduledCountdownDisplay" style="font-size: 11px; color: #34d399; font-weight: bold;"></div>
        </div>

        <div id="mainLandingView">
            <div class="card">
                <input type="text" id="userNameInput" class="code-input" placeholder="Your Display Name" style="margin-bottom: 8px;">
            </div>
            <div class="card" onclick="startHostingSession()" style="cursor: pointer; border-color: rgba(251, 191, 36, 0.6);">
                <div style="font-weight: 900; font-size: 16px; color: #fbbf24;">👑 Create Golden Room (Host)</div>
            </div>
            <div class="card">
                <input type="text" id="roomCodeInput" class="code-input" placeholder="e.g. SYNC-A1B2" maxlength="10" style="margin-bottom: 12px;">
                <button class="btn-purple" onclick="connectToRoom()">✨ Join Room</button>
            </div>
        </div>

        <div id="hostSessionView" class="hidden">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 12px; font-weight: bold; color: #fbbf24;">Room Session</span>
                    <span id="bandwidthStatusBadge" class="badge-warning hidden">⚠️ Network Lag Detected</span>
                </div>
                <div id="displayRoomCode" style="font-size: 20px; font-weight: 900; text-align: center; color: #fbbf24; margin-bottom: 10px;"></div>
                <button class="btn-purple" style="background: #ef4444; color: #fff;" onclick="leaveRoom()">Leave Room</button>
            </div>

            <div class="card">
                <div style="display: flex; gap: 8px; margin-bottom: 10px; width: 100%;">
                    <input type="text" id="videoUrlInput" class="search-input" placeholder="YouTube Video ID or URL..." style="margin-bottom: 0;">
                    <button class="code-action-btn" style="background: #fbbf24; color: #1c1404; font-weight: bold; border-radius: 10px; padding: 0 16px;" onclick="loadVideo()">Load</button>
                </div>
                <div style="position: relative; width: 100%; height: 200px; background: #000; border-radius: 12px; overflow: hidden;">
                    <div id="ytPlayerDiv" style="width:100%; height:100%;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WS_URL = 'wss://syncbeat-backend2.onrender.com';
        let ws = null; let isHosting = false; let ytPlayer = null; let ytReady = false; let currentRoomCode = ''; let targetEpochTime = null;
        document.getElementById('detectedTz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;

        function broadcastTimezoneSchedule() {
            const val = document.getElementById('targetWatchTime').value;
            if(!val) return alert("Select a date and time first.");
            targetEpochTime = new Date(val).getTime();
            if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'SCHEDULE_TIMEZONE', targetTime: targetEpochTime }));
            startLiveCountdown();
        }

        function startLiveCountdown() {
            if(!targetEpochTime) return;
            const timerInterval = setInterval(() => {
                const diff = targetEpochTime - Date.now();
                if(diff <= 0) { document.getElementById('scheduledCountdownDisplay').textContent = "🚀 Watch Party Starting Now!"; clearInterval(timerInterval); return; }
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('scheduledCountdownDisplay').textContent = `⏱️ Starts in: ${mins}m ${secs}s`;
            }, 1000);
        }

        let lastFrameCheck = Date.now();
        setInterval(() => {
            if(ytPlayer && typeof ytPlayer.getPlayerState === 'function' && ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                const now = Date.now();
                const lag = (now - lastFrameCheck) - 1000;
                lastFrameCheck = now;
                if(lag > 400) document.getElementById('bandwidthStatusBadge').classList.remove('hidden');
                else document.getElementById('bandwidthStatusBadge').classList.add('hidden');
            }
        }, 1000);

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('ytPlayerDiv', { height: '100%', width: '100%', videoId: '', events: { 'onReady': () => { ytReady = true; } } });
        }

        function connectWebSocket(callback) {
            ws = new WebSocket(WS_URL);
            ws.onopen = () => { if(callback) callback(); };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if(data.type === 'ROOM_CREATED' || data.type === 'ROOM_JOINED') {
                    document.getElementById('mainLandingView').classList.add('hidden');
                    document.getElementById('timezoneCard').classList.add('hidden');
                    document.getElementById('hostSessionView').classList.remove('hidden');
                    document.getElementById('displayRoomCode').textContent = data.code;
                } else if(data.type === 'SCHEDULE_TIMEZONE') {
                    targetEpochTime = data.targetTime; startLiveCountdown();
                } else if(data.type === 'LOAD_YOUTUBE') {
                    if(ytReady && ytPlayer) ytPlayer.loadVideoById(data.videoId);
                }
            };
        }

        function startHostingSession() {
            currentRoomCode = 'SYNC-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            connectWebSocket(() => { isHosting = true; ws.send(JSON.stringify({ type: 'HOST_ROOM', code: currentRoomCode })); });
        }

        function connectToRoom() {
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if(!code) return;
            currentRoomCode = code;
            connectWebSocket(() => { isHosting = false; ws.send(JSON.stringify({ type: 'JOIN_ROOM', code: code })); });
        }

        function loadVideo() {
            const input = document.getElementById('videoUrlInput').value.trim();
            if(!input) return;
            if(ytReady && ytPlayer) ytPlayer.loadVideoById(input);
            if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'LOAD_YOUTUBE', videoId: input }));
        }

        function leaveRoom() {
            if(ws) ws.close();
            document.getElementById('hostSessionView').classList.add('hidden');
            document.getElementById('mainLandingView').classList.remove('hidden');
            document.getElementById('timezoneCard').classList.remove('hidden');
        }
    </script>
</body>
</html>
